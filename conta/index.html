<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#0d3157">
  <title>Redirecionando | Portal da Regulação</title>
  <link rel="icon" href="/assets/portal-regulacao-header_512x512.png?v=20260911-1" type="image/png">
  <link rel="stylesheet" href="/css/portal.css?v=20260816-5">
  <script>
    (() => {
      const params = new URLSearchParams(location.search);
      const hash = String(location.hash || '').replace(/^#/, '');
      let destination = '/perfil/';
      if (params.has('primeiro-acesso') || params.has('verificar-email') || params.has('email-verificado') || hash === 'seguranca') {
        destination = '/seguranca/';
      } else if (hash === 'interfaceSoundsCard' || hash === 'socialPreferencesCard') {
        destination = `/configuracoes/${hash ? `#${hash}` : ''}`;
      } else if (hash === 'accountLevelPanel') {
        destination = '/conquistas/';
      }
      if (destination === '/seguranca/' && params.toString()) destination += `?${params.toString()}`;
      location.replace(destination);
    })();
  </script>
</head>
<body class="portal-page">
  <main class="portal-main" style="max-width:760px;margin:60px auto;padding:24px">
    <section class="portal-note info"><strong>Organizamos melhor sua conta.</strong><br>Esta rota antiga agora apenas encaminha para Perfil, Segurança, Configurações ou Conquistas.</section>
    <p style="margin-top:18px"><a class="portal-button primary linklike" href="/perfil/">Abrir meu perfil</a></p>
  </main>
</body>
</html>
