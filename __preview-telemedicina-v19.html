<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Prévia Telemedicina V19</title>
  <style>
    html,body{margin:0;min-height:100%;background:#dbe8ef}
    #previewStatus{font:700 16px/1.5 system-ui,sans-serif;color:#173a59;padding:32px;text-align:center}
    .preview-mobile-shell{display:flex;justify-content:center;padding:20px;box-sizing:border-box}
    .preview-mobile-shell iframe{width:390px;height:844px;border:1px solid #90a9b8;border-radius:18px;background:#fff;box-shadow:0 18px 50px rgba(23,54,76,.2)}
  </style>
</head>
<body>
  <div id="previewStatus">Preparando a prévia institucional da Telemedicina…</div>
  <script>
    (async () => {
      const params = new URLSearchParams(location.search);
      if (params.get('mobile') === '1') {
        document.body.className = 'preview-mobile-shell';
        document.body.innerHTML = '<iframe title="Telemedicina em 390 pixels" src="?app=1"></iframe>';
        return;
      }
      const base = 'https://raw.githack.com/regulacaoeldoradoms-cpu/guia-regulacao-eldorado/preview-telemedicina-v19/';
      const mock = "(() => {\n  const clone = (value) => JSON.parse(JSON.stringify(value));\n  const today = '2026-09-05';\n  const patients = [\n    { id: 'p1', name: 'Paciente Teste Alfa' },\n    { id: 'p2', name: 'Paciente Teste Beta' },\n    { id: 'p3', name: 'Paciente Teste Gama' },\n    { id: 'p4', name: 'Paciente Teste Delta' },\n    { id: 'p5', name: 'Paciente Teste Épsilon' }\n  ];\n  let followups = [\n    { id: 'f1', patientId: 'p1', patientName: 'Paciente Teste Alfa', specialty: 'CARDIOLOGIA', resolution: 'RETORNO COM RESULTADOS DE EXAMES CARDIOLÓGICOS', lastConsultationDate: '2026-08-14', returnDueDate: '2026-09-19', reminderDates: ['2026-09-04', '2026-09-07', '2026-09-08'], status: 'EM AGUARDO', alertToday: false, needsReview: false },\n    { id: 'f2', patientId: 'p2', patientName: 'Paciente Teste Beta', specialty: 'ENDOCRINOLOGIA', resolution: 'AVALIAR AJUSTE TERAPÊUTICO E EXAMES LABORATORIAIS', lastConsultationDate: '2026-08-01', returnDueDate: '2026-09-20', reminderDates: ['2026-09-05', '2026-09-08', '2026-09-09'], status: 'SOLICITAR', alertToday: true, reminderNumber: 1, needsReview: false },\n    { id: 'f3', patientId: 'p3', patientName: 'Paciente Teste Gama', specialty: 'NEFROLOGIA', resolution: 'RETORNO PRIORITÁRIO PARA REAVALIAÇÃO CLÍNICA', lastConsultationDate: '2026-07-11', returnDueDate: '2026-08-22', reminderDates: ['2026-08-07', '2026-08-10', '2026-08-11'], status: 'ATRASADO', alertToday: false, needsReview: false },\n    { id: 'f4', patientId: 'p4', patientName: 'Paciente Teste Delta', specialty: 'ORTOPEDIA', resolution: 'RETORNO APÓS FISIOTERAPIA', lastConsultationDate: '2026-08-29', returnDueDate: '', reminderDates: [], status: 'SEM PROGRAMAÇÃO', alertToday: false, needsReview: true },\n    { id: 'f5', patientId: 'p5', patientName: 'Paciente Teste Épsilon', specialty: 'PSIQUIATRIA', resolution: 'SOLICITAÇÃO REGISTRADA PARA CONTINUIDADE DO CUIDADO', lastConsultationDate: '2026-08-20', returnDueDate: '2026-09-26', reminderDates: ['2026-09-11', '2026-09-14', '2026-09-15'], status: 'SOLICITADO', alertToday: false, requestedAt: '2026-09-03', needsReview: false }\n  ];\n\n  function counts() {\n    return {\n      solicitar: followups.filter((item) => item.status === 'SOLICITAR').length,\n      atrasado: followups.filter((item) => item.status === 'ATRASADO').length,\n      emAguardo: followups.filter((item) => item.status === 'EM AGUARDO').length,\n      semProgramacao: followups.filter((item) => item.status === 'SEM PROGRAMAÇÃO').length,\n      alertasHoje: followups.filter((item) => item.alertToday && !item.requestedAt).length\n    };\n  }\n\n  async function api(route, options = {}) {\n    await new Promise((resolve) => setTimeout(resolve, 30));\n    if (route === '/api/telemedicina/dashboard') {\n      return clone({ today, actor: { admin: true }, patients, followups, counts: counts() });\n    }\n    const patientMatch = route.match(/^\\/api\\/telemedicina\\/patients\\/([^/]+)$/);\n    if (patientMatch) {\n      const patientId = decodeURIComponent(patientMatch[1]);\n      const patient = patients.find((item) => item.id === patientId) || { id: patientId, name: 'Paciente Teste' };\n      const current = followups.filter((item) => item.patientId === patientId);\n      return clone({\n        patient,\n        followups: current,\n        events: current.map((item) => ({\n          id: 'event-' + item.id,\n          eventDate: item.lastConsultationDate,\n          specialty: item.specialty,\n          eventType: 'consulta',\n          resolution: item.resolution,\n          notes: 'Registro sintético usado exclusivamente na validação visual.',\n          returnDueDate: item.returnDueDate\n        }))\n      });\n    }\n    const scheduleMatch = route.match(/^\\/api\\/telemedicina\\/followups\\/([^/]+)\\/schedule$/);\n    if (scheduleMatch && options.method === 'PATCH') {\n      const body = JSON.parse(options.body || '{}');\n      const item = followups.find((entry) => entry.id === decodeURIComponent(scheduleMatch[1]));\n      if (item) {\n        item.returnDueDate = body.returnDueDate || '2026-10-02';\n        item.reminderDates = ['2026-09-17', '2026-09-18', '2026-09-21'];\n        item.status = 'EM AGUARDO';\n        item.needsReview = false;\n      }\n      return clone({ followup: item });\n    }\n    const requestedMatch = route.match(/^\\/api\\/telemedicina\\/followups\\/([^/]+)\\/requested$/);\n    if (requestedMatch && options.method === 'POST') {\n      const item = followups.find((entry) => entry.id === decodeURIComponent(requestedMatch[1]));\n      if (item) {\n        item.status = 'SOLICITADO';\n        item.requestedAt = today;\n        item.alertToday = false;\n      }\n      return clone({ followup: item });\n    }\n    if (route === '/api/telemedicina/consultations' && options.method === 'POST') {\n      const body = JSON.parse(options.body || '{}');\n      const patient = { id: 'p' + (patients.length + 1), name: body.patientName };\n      patients.push(patient);\n      followups.push({\n        id: 'f' + (followups.length + 1),\n        patientId: patient.id,\n        patientName: patient.name,\n        specialty: body.specialty,\n        resolution: body.resolution,\n        lastConsultationDate: body.consultationDate,\n        returnDueDate: body.returnDueDate || '',\n        reminderDates: [],\n        status: body.returnDueDate ? 'EM AGUARDO' : 'SEM PROGRAMAÇÃO',\n        needsReview: !body.returnDueDate\n      });\n      return { ok: true };\n    }\n    if (/^\\/api\\/telemedicina\\/(patients|followups)\\//.test(route) && options.method === 'PATCH') {\n      return { ok: true };\n    }\n    if (route.includes('/api/telemedicina/specialties/')) return { total: 0, items: [], done: true };\n    if (route.includes('/api/telemedicina/import')) return { ok: true };\n    return { ok: true };\n  }\n\n  window.RegulationAuth = {\n    requireRole: async () => ({ role: 'admin', name: 'Profissional de Teste', username: 'teste' }),\n    api,\n    logout: async () => {}\n  };\n})();";
      try {
        const response = await fetch(base + 'telemedicina/index.html', { cache: 'no-store' });
        if (!response.ok) throw new Error('Falha ao carregar a página: ' + response.status);
        let html = await response.text();
        html = html.replace(
          /\s*<script src="\/js\/auth-config\.js[^>]*><\/script>\s*<script src="\/js\/auth-client\.js[^>]*><\/script>/,
          '\n  <script>' + mock + '<\\/script>'
        );
        html = html.replace(/(href|src)="\//g, '$1="' + base);
        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        document.getElementById('previewStatus').textContent = error.message;
      }
    })();
  </script>
</body>
</html>
