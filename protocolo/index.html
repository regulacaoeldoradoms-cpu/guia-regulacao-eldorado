<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Protocolos usados no Guia</title>
<style>
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f8fafc;color:#0f172a}header{position:sticky;top:0;background:white;border-bottom:1px solid #e2e8f0;padding:14px 24px;z-index:2;display:flex;gap:12px;align-items:center;justify-content:space-between}h1{font-size:22px;margin:0}main{max-width:1180px;margin:0 auto;padding:22px}.hero,.box{background:white;border:1px solid #e2e8f0;border-radius:18px;box-shadow:0 10px 24px #0001}.hero{padding:18px;margin-bottom:16px}.grid{display:grid;grid-template-columns:340px 1fr;gap:16px}.side,.detail{padding:16px}.list{max-height:calc(100vh - 260px);overflow:auto}.item{display:block;width:100%;text-align:left;border:1px solid #e2e8f0;background:white;border-radius:14px;padding:12px;margin:0 0 8px}.item.active{background:#eff6ff;border-color:#93c5fd}input,select{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:12px;font:inherit;font-weight:700}.tools{display:grid;grid-template-columns:1fr 210px 220px;gap:10px}.muted{color:#64748b}.badge{display:inline-block;margin:4px 4px 4px 0;padding:5px 8px;border-radius:999px;font-size:11px;font-weight:900;border:1px solid}.b1{background:#dbeafe;color:#1d4ed8}.b2{background:#ccfbf1;color:#0f766e}.b3{background:#ede9fe;color:#6d28d9}.b4{background:#f1f5f9;color:#334155}.sec{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.card{border:1px solid #e2e8f0;border-radius:14px;padding:12px;background:white}.red{background:#fff1f2}.orange{background:#fff7ed}.blue{background:#eff6ff}.green{background:#f0fdf4}.amber{background:#fffbeb}.card h3{font-size:15px;margin:0 0 8px}.card ul{margin:0;padding-left:20px;line-height:1.45}.btn{border:1px solid #e2e8f0;border-radius:12px;background:white;color:#0f172a;padding:10px 12px;font-weight:800;text-decoration:none}.dark{background:#020617;color:white}@media(max-width:850px){header{display:block}.tools,.grid,.sec{grid-template-columns:1fr}.list{max-height:none}}@media print{header,.hero,.side{display:none}.grid{display:block}.box{box-shadow:none;border:0}.sec{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header><div><h1>📚 Protocolos usados no Guia</h1><div class="muted">Consulta por categoria e via de atendimento</div></div><div><a class="btn" href="../">← Voltar ao guia</a> <button class="btn dark" onclick="window.print()">🖨️ Imprimir seção</button></div></header>
<main>
<section class="hero"><h2>Protocolos e fontes técnicas</h2><p>Esta página carrega a base estruturada do Guia Unificado e permite consultar os textos por categoria, via e palavra-chave.</p><div class="tools"><input id="q" placeholder="Pesquisar especialidade, exame, sintoma ou palavra do protocolo..."><select id="via"><option value="todos">Todas as vias</option><option value="presencial">Presencial</option><option value="teleconsulta">Teleconsulta</option><option value="assincrona">Discussão de conduta</option><option value="indisponivel">Não disponível em teleatendimento</option></select><select id="cat"><option value="todos">Todas as categorias</option></select></div></section>
<section class="grid"><aside class="box side"><strong>Protocolos</strong><div id="count" class="muted">Carregando...</div><div id="list" class="list"></div></aside><section id="detail" class="box detail"><p class="muted">Carregando protocolos...</p></section></section>
</main>
<script>
const $=id=>document.getElementById(id);const A=v=>Array.isArray(v)?v:(v?[v]:[]);const E=s=>(s??'').toString().replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const N=s=>(s??'').toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();let P=[],sel=null;
function getArray(t){let p=t.indexOf('const PROTOCOLOS');let i=t.indexOf('[',p);let d=0,q='',esc=false;for(let x=i;x<t.length;x++){let c=t[x];if(q){if(esc){esc=false;continue}if(c==='\\'){esc=true;continue}if(c===q)q='';continue}if(c==='"'||c==="'"||c==='`'){q=c;continue}if(c==='[')d++;if(c===']'){d--;if(d===0)return t.slice(i,x+1)}}throw Error('não achei fim do array')}
function B(p){let s=p.sistemas||{},o='';if(s.sisreg)o+='<span class="badge b1">PRESENCIAL</span>';if(s.digsus&&s.digsusStatus==='disponivel')o+='<span class="badge b2">TELECONSULTA</span>';if(s.digsus&&s.digsusStatus==='assincrona')o+='<span class="badge b3">DISCUSSÃO DE CONDUTA</span>';if(s.digsusStatus==='indisponivel_local'||s.digsusStatus==='nao_consta')o+='<span class="badge b4">NÃO DISPONÍVEL EM TELEATENDIMENTO</span>';return o}
function T(p){let z=[p.nome,p.categoria,p.resumo,p.fluxoLocal,p.faixaEtaria,...A(p.fontes),...A(p.tags),...A(p.quandoSolicitar),...A(p.informacoesObrigatorias),...A(p.examesObrigatorios),...A(p.examesCondicionais),...A(p.complementares),...A(p.ajudaPriorizacao),...A(p.alertas),p.modelo];A(p.subprotocolos).forEach(s=>z.push(s.titulo,...A(s.quando),...A(s.obrigatorias),...A(s.examesObrigatorios),...A(s.condicionais),...A(s.complementares)));return N(z.join(' '))}
function ok(p){let s=p.sistemas||{},v=$('via').value;if(v==='presencial'&&!s.sisreg)return false;if(v==='teleconsulta'&&!(s.digsus&&s.digsusStatus==='disponivel'))return false;if(v==='assincrona'&&!(s.digsus&&s.digsusStatus==='assincrona'))return false;if(v==='indisponivel'&&!(s.digsusStatus==='indisponivel_local'||s.digsusStatus==='nao_consta'))return false;if($('cat').value!=='todos'&&(p.categoria||'Sem categoria')!==$('cat').value)return false;let w=N($('q').value).split(/\s+/).filter(Boolean);return !w.length||w.every(x=>p._t.includes(x))}
function L(a){a=A(a);return a.length?'<ul>'+a.map(x=>'<li>'+E(x)+'</li>').join('')+'</ul>':'<p class="muted">Não informado ou não se aplica.</p>'}
function C(t,a,c){return '<div class="card '+(c||'')+'"><h3>'+t+'</h3>'+L(a)+'</div>'}
function show(p){sel=p;document.querySelectorAll('.item').forEach(b=>b.classList.toggle('active',b.dataset.id===p.id));let sub='';A(p.subprotocolos).forEach((s,i)=>{sub+='<details '+(i===0?'open':'')+'><summary>'+E(s.titulo)+'</summary><div class="sec">'+C('Quando considerar',s.quando)+C('Informações obrigatórias',s.obrigatorias,'red')+C('Exames obrigatórios',s.examesObrigatorios,'red')+C('Condicionais',s.condicionais,'orange')+C('Complementares',s.complementares,'blue')+'</div></details>'});$('detail').innerHTML='<div>'+B(p)+'<h2>'+E(p.nome)+'</h2><div class="muted">'+E(p.categoria||'')+(p.faixaEtaria?' • '+E(p.faixaEtaria):'')+'</div><p>'+E(p.resumo||'')+'</p><div class="sec">'+C('Quando solicitar',p.quandoSolicitar)+C('Informações obrigatórias',p.informacoesObrigatorias,'red')+C('Exames obrigatórios',p.examesObrigatorios,'red')+C('Obrigatórios se houver condição',p.examesCondicionais,'orange')+C('Complementares / se houver',p.complementares,'blue')+C('Ajuda na priorização',p.ajudaPriorizacao,'green')+'</div>'+sub+(A(p.alertas).length?C('Alertas / fluxo hospitalar quando grave',p.alertas,'amber'):'')+'<div class="card"><h3>Modelo interno</h3><p>'+E(p.modelo||'')+'</p></div><p class="muted">Fonte(s): '+A(p.fontes).map(E).join(' • ')+'</p></div>'}
function render(){let f=P.filter(ok);$('count').textContent=f.length+' protocolo(s) encontrado(s)';$('list').innerHTML=f.map(p=>'<button class="item '+(sel&&sel.id===p.id?'active':'')+'" data-id="'+E(p.id)+'"><h3>'+E(p.nome)+'</h3><p>'+E(p.resumo||'')+'</p>'+B(p)+'</button>').join('')||'<p class="muted">Nenhum protocolo encontrado.</p>';document.querySelectorAll('.item').forEach(b=>b.onclick=()=>show(P.find(p=>p.id===b.dataset.id)));if(f.length&&(!sel||!f.some(p=>p.id===sel.id)))show(f[0])}
async function load(){try{let h=await fetch('../index.html?x='+Date.now()).then(r=>r.text());P=JSON.parse(getArray(h));P.forEach(p=>p._t=T(p));P.sort((a,b)=>(a.prioridade||99)-(b.prioridade||99)||a.nome.localeCompare(b.nome,'pt-BR'));let cats=[...new Set(P.map(p=>p.categoria||'Sem categoria'))].sort((a,b)=>a.localeCompare(b,'pt-BR'));$('cat').innerHTML='<option value="todos">Todas as categorias</option>'+cats.map(c=>'<option value="'+E(c)+'">'+E(c)+'</option>').join('');render()}catch(e){$('detail').innerHTML='<p class="muted">Falha ao carregar: '+E(e.message)+'</p>';$('count').textContent='Erro ao carregar'}}
$('q').oninput=render;$('via').onchange=render;$('cat').onchange=render;load();
</script>
</body>
</html>
