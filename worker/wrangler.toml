name = "yellow-wave-d0a1guia-regulacao-ia"
main = "index.js"
compatibility_date = "2026-07-28"
workers_dev = true

[vars]
ALLOWED_ORIGINS = "https://regulacaoeldoradoms.com.br,https://www.regulacaoeldoradoms.com.br"
GEMINI_MODEL = "gemini-3.5-flash-lite"
AUTH_ENFORCE_AI = "false"

# Integração GitHub -> Cloudflare ativa. Commits na branch main disparam o deploy do Worker.
# O Wrangler 4 provisiona automaticamente esta base D1 no primeiro deploy.
# Ela armazena apenas contas de acesso do portal; não armazena dados de pacientes.
[[d1_databases]]
binding = "AUTH_DB"
database_name = "portal-regulacao-users"

# Segredos: nunca colocar valores reais neste arquivo ou no GitHub.
# GEMINI_API_KEY, AUTH_SESSION_SECRET e AUTH_USERS_JSON permanecem no painel da Cloudflare.
# AUTH_USERS_JSON funciona como conta/bootstrap de emergência e é migrado para o D1 após login/troca de senha.
# Perfis aceitos: medico, recepcao e admin. O perfil admin é o nível máximo/desenvolvedor.
