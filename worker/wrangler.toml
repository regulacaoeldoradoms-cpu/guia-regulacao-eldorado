name = "yellow-wave-d0a1guia-regulacao-ia"
main = "index.js"
compatibility_date = "2026-08-25"
workers_dev = true
keep_vars = true

[observability]
enabled = true
head_sampling_rate = 1

[vars]
ALLOWED_ORIGINS = "https://regulacaoeldoradoms.com.br,https://www.regulacaoeldoradoms.com.br"
GEMINI_MODEL = "gemini-3.5-flash-lite"
GEMINI_FALLBACK_MODELS = "gemini-3.6-flash"
GEMINI_REQUEST_TIMEOUT_MS = "5000"
GEMINI_TOTAL_TIMEOUT_MS = "11000"
CLOUDFLARE_AI_FALLBACK_ENABLED = "true"
CLOUDFLARE_AI_MODEL = "@cf/meta/llama-3.1-8b-instruct-fast"
CLOUDFLARE_AI_FALLBACK_MODELS = "@cf/zai-org/glm-4.7-flash"
CLOUDFLARE_AI_TIMEOUT_MS = "16000"
CLOUDFLARE_AI_TOTAL_TIMEOUT_MS = "30000"
AUTH_ENFORCE_AI = "true"
# A exigência de e-mail verificado fica desligada durante a migração.
# Ativar somente depois que o fluxo de confirmação estiver funcionando em produção controlada.
AUTH_REQUIRE_EMAIL_VERIFICATION = "false"
# Migração controlada concluída. Manter desligada no uso normal.
# Só ligar novamente de forma deliberada se houver uma nova migração de administradores legados.
AUTH_MIGRATE_LEGACY_ADMINS = "false"

[ai]
binding = "AI"

# Integração GitHub -> Cloudflare ativa. Commits na branch main disparam o deploy do Worker.
# O Wrangler 4 provisiona automaticamente esta base D1 no primeiro deploy.
# O D1 mantém autenticação, permissões, índices técnicos, rate limits e notificações.
# O conteúdo das manifestações do Conselho é armazenado no Firebase/Firestore.
[[d1_databases]]
binding = "AUTH_DB"
database_name = "portal-regulacao-users"

# Segredos existentes: nunca colocar valores reais neste arquivo ou no GitHub.
# GEMINI_API_KEY, AUTH_SESSION_SECRET e AUTH_USERS_JSON permanecem no painel da Cloudflare.
# AUTH_RATE_LIMIT_SECRET é recomendado para anonimizar o identificador usado no limite de cadastros.
# AUTH_DEVELOPER_USERNAMES deve conter somente os usuários que realmente mantêm o nível Desenvolvedor,
# separados por vírgula. O valor é normalizado da mesma forma que o login do portal.
# Enquanto AUTH_MIGRATE_LEGACY_ADMINS estiver true, qualquer admin fora dessa lista migra para Coordenação.
# Não colocar o valor real aqui; configurar no painel da Cloudflare antes da publicação desta versão.
#
# Compatibilidade com validação histórica: a antiga documentação usava o marcador SENHA_FORTE apenas como exemplo.
# Nenhuma senha real deve ser gravada neste arquivo.
#
# Firebase/Conselho - configurar no painel da Cloudflare antes de ativar o recebimento:
# FIREBASE_PROJECT_ID          -> variável
# FIREBASE_CLIENT_EMAIL        -> variável/segredo da conta de serviço
# FIREBASE_PRIVATE_KEY         -> SEGREDO; chave privada PEM da conta de serviço
# FIREBASE_WEB_API_KEY         -> variável usada pela API do Firebase Authentication
# FIREBASE_STORAGE_BUCKET      -> variável do bucket privado de anexos
#
# A conta de serviço deve possuir somente as permissões necessárias para os recursos utilizados.
# Sem essas variáveis, o portal profissional continua funcionando e o módulo do Conselho
# informa que aguarda a conexão do Firebase, sem gravar manifestações em outro local.
#
# Perfis primários aceitos: medico, recepcao, coordenacao, cidadao e admin.
# admin = Desenvolvedor (nível técnico máximo). coordenacao = gestão operacional sem acesso técnico máximo.
# Funções do Conselho são independentes: membro e presidente.
# O Canal do Cidadão é uma capacidade transversal: toda conta ativa pode utilizá-lo em caráter pessoal,
# sem substituir o perfil profissional principal nem conceder permissões institucionais adicionais.
