name: Validar pré-regulação conversacional

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-pre-regulation:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Validar sintaxe JavaScript
        run: |
          node --check js/ai-config.js
          node --check js/pre-regulation-bridge.js
          node --check js/ai-assistant.js
          node --check js/ai-gemini-theme.js
          node --check worker/gemini-assistant.js
          node --check worker/index.js

      - name: Testar resiliência dos provedores de IA
        run: npm --prefix worker test

      - name: Conferir modo conversacional
        run: |
          grep -q "mode: 'pre_regulation_simulator'" js/ai-config.js
          grep -q 'maxQuestionLength: 3000' js/ai-config.js
          grep -q 'maxHistoryMessages: 12' js/ai-config.js
          grep -q 'MODO DE PRÉ-REGULAÇÃO CONVERSACIONAL' js/ai-assistant.js
          grep -q 'no máximo 3 perguntas objetivas' js/ai-assistant.js
          grep -q 'Mantenha continuidade entre as mensagens' js/ai-assistant.js
          grep -q 'praticaRegulatoria: practicalContext' js/ai-assistant.js
          grep -q 'motivosRecorrentesDeDevolucao' js/ai-assistant.js
          grep -q 'exigeProfissionalHabilitado' js/ai-assistant.js
          grep -q 'Encaminhamento bem qualificado' js/ai-assistant.js
          grep -q 'Necessita complementação' js/ai-assistant.js
          grep -q 'Conferir fluxo/procedimento' js/ai-assistant.js
          grep -q 'Atenção clínica' js/ai-assistant.js

      - name: Conferir compactação para o Worker atual
        run: |
          grep -q 'MAX_REQUEST_BYTES = 76000' js/pre-regulation-bridge.js
          grep -q 'compactPractice' js/pre-regulation-bridge.js
          grep -q 'practiceSubprotocol' js/pre-regulation-bridge.js
          grep -q 'compactOfficialSubprotocol' js/pre-regulation-bridge.js
          grep -q 'SUBPROTOCOL_CONTEXT_RULE' js/pre-regulation-bridge.js
          grep -q 'parentRequirements' js/pre-regulation-bridge.js
          grep -q 'campo geral vazio não significa ausência de requisitos' js/pre-regulation-bridge.js
          grep -q 'Não existe uma lista única no nível geral' js/pre-regulation-bridge.js
          grep -q 'fitPayload' js/pre-regulation-bridge.js
          grep -q 'byteSize' js/pre-regulation-bridge.js
          grep -q 'pre_regulation_compact_v3' js/pre-regulation-bridge.js
          grep -q 'CASO ATUAL' js/pre-regulation-bridge.js
          grep -q 'no máximo 3 perguntas objetivas' js/pre-regulation-bridge.js
          grep -q 'pre-regulation-bridge.js?v=20260904-1' medico/index.html
          python - <<'PY'
          from pathlib import Path
          html = Path('medico/index.html').read_text(encoding='utf-8')
          assert html.index('/js/ai-config.js') < html.index('/js/pre-regulation-bridge.js') < html.index('/js/ai-assistant.js')
          PY

      - name: Conferir Worker nativo atualizado
        run: |
          grep -q 'simulador de pré-regulação' worker/gemini-assistant.js
          grep -q 'no máximo 3 perguntas objetivas' worker/gemini-assistant.js
          grep -q 'body.originalQuestion || body.question' worker/gemini-assistant.js
          grep -q 'praticaRegulatoria' worker/gemini-assistant.js
          grep -q 'slice(-12)' worker/gemini-assistant.js
          grep -q 'boundedString(item.text, 3000)' worker/gemini-assistant.js
          grep -q 'maxOutputTokens: 1300' worker/gemini-assistant.js
          grep -q 'assistantMode' worker/gemini-assistant.js
          grep -q 'AbortSignal.timeout' worker/gemini-assistant.js
          grep -q 'GEMINI_UPSTREAM_TIMEOUT' worker/gemini-assistant.js
          grep -q 'Cloudflare Workers AI' worker/gemini-assistant.js
          grep -q 'max_tokens: 1300' worker/gemini-assistant.js
          grep -q 'max_completion_tokens: 1800' worker/gemini-assistant.js
          grep -q "reasoning_effort: 'low'" worker/gemini-assistant.js
          grep -q 'cloudflare_ai_model_succeeded' worker/gemini-assistant.js
          grep -q 'GEMINI_TOTAL_TIMEOUT_MS' worker/index.js
          grep -q 'gemini_resilience_exhausted' worker/index.js
          grep -q 'cloudflare_ai_fallback_succeeded' worker/index.js
          grep -q 'AI_PROVIDERS_TEMPORARILY_UNAVAILABLE' worker/index.js
          grep -q 'GEMINI_REQUEST_TIMEOUT_MS = "5000"' worker/wrangler.toml
          grep -q 'GEMINI_TOTAL_TIMEOUT_MS = "11000"' worker/wrangler.toml
          grep -q 'CLOUDFLARE_AI_FALLBACK_ENABLED = "true"' worker/wrangler.toml
          grep -q 'CLOUDFLARE_AI_MODEL = "@cf/meta/llama-3.1-8b-instruct-fast"' worker/wrangler.toml
          grep -q 'CLOUDFLARE_AI_FALLBACK_MODELS = "@cf/zai-org/glm-4.7-flash"' worker/wrangler.toml
          grep -q 'CLOUDFLARE_AI_TIMEOUT_MS = "16000"' worker/wrangler.toml
          grep -q 'CLOUDFLARE_AI_TOTAL_TIMEOUT_MS = "30000"' worker/wrangler.toml
          grep -q 'binding = "AI"' worker/wrangler.toml
          grep -q 'enabled = true' worker/wrangler.toml

      - name: Conferir CORS autenticado da IA
        run: |
          grep -q "url.pathname === '/api/ia'" worker/index.js
          grep -q "request.method !== 'OPTIONS'" worker/index.js
          grep -q "Access-Control-Allow-Headers': 'Content-Type, Authorization'" worker/gemini-assistant.js
          grep -q "request.method === 'OPTIONS'" worker/gemini-assistant.js
          python - <<'PY'
          from pathlib import Path
          text = Path('worker/index.js').read_text(encoding='utf-8')
          guard = text.index("url.pathname === '/api/ia'")
          assert "request.method !== 'OPTIONS'" in text[guard:guard+450]
          PY

      - name: Conferir interface e cache
        run: |
          grep -q 'Pré-regulação com IA' js/ai-assistant.js
          grep -q 'Descreva o caso ou cole o encaminhamento anonimizado' js/ai-assistant.js
          grep -q "title.textContent = 'Pré-regulação com IA'" js/ai-gemini-theme.js
          grep -q 'Simulação baseada em protocolo + prática regulatória' js/ai-gemini-theme.js
          grep -q 'Assistente com base nos protocolos' js/ai-gemini-theme.js
          grep -q 'Protocolo oficial + pré-regulação conversacional com IA' medico/index.html
          grep -q 'ai-config.js?v=20260825-2' medico/index.html
          grep -q 'referral-workbench.js?v=20260904-1' medico/index.html
          grep -q 'pre-regulation-bridge.js?v=20260904-1' medico/index.html
          grep -q 'ai-assistant.js?v=20260828-1' medico/index.html
          grep -q 'ai-gemini-theme.js?v=20260825-2' medico/index.html
          grep -q 'ai-assistant.css?v=20260825-1' medico/index.html
          grep -q 'ai-gemini-theme.css?v=20260825-1' medico/index.html
          grep -q 'REMOTE_AI_COOLDOWN_MS' js/ai-assistant.js
          grep -q 'Contingência local' js/ai-assistant.js
          grep -q 'IA configurada' js/ai-gemini-theme.js
          grep -q 'IA de contingência conectada' js/ai-assistant.js
          ! grep -q 'A conexão com o Gemini falhou:' js/ai-assistant.js

      - name: Conferir tratamento visual de subprotocolos
        run: |
          grep -q 'removeRedundantParentBlocks' js/referral-workbench.js
          grep -q "'protocolMandatoryExams', 'examesObrigatorios', 'examesObrigatorios'" js/referral-workbench.js
          grep -q "'protocolConditionalExams', 'examesCondicionais', 'condicionais'" js/referral-workbench.js
          grep -q 'removeRedundantParentBlocks(article, selected)' js/referral-workbench.js

      - name: Conferir limites de segurança
        run: |
          grep -q 'nunca se apresente como regulador oficial' js/ai-assistant.js
          grep -q 'nunca emita autorização, negativa oficial ou classificação de risco real' js/ai-assistant.js
          grep -q 'Não recomende cancelamento e reinserção automaticamente' js/ai-assistant.js
          grep -q 'sem se apresentar como regulador oficial' js/pre-regulation-bridge.js
          grep -q 'Você NÃO é o regulador oficial' worker/gemini-assistant.js
          grep -q 'não substitui avaliação clínica, classificação de risco nem decisão do regulador responsável' medico/index.html
