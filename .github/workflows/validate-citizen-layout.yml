name: Citizen mobile layout
on:
  pull_request:
    paths:
      - "css/citizen-readable-layout.css"
      - "css/home-tools-carousel.css"
      - "css/home-mobile-direct.css"
      - "index.html"
      - "js/citizen-layout.js"
      - "js/home.js"
      - "js/home-mobile-composition.js"
      - "js/home-social-presentation.js"
      - "js/home-mobile-direct.js"
      - "js/social-navigation.js"
      - "js/portal-chat.js"
      - "js/account-section-shell.js"
      - "mascotes/index.html"
      - "testing/citizen-layout/**"
      - ".github/workflows/validate-citizen-layout.yml"
permissions:
  contents: read
jobs:
  synthetic-citizen:
    runs-on: ubuntu-latest
    steps:
      # The focused Home checks use the same synthetic-only browser fixture.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser harness
        working-directory: testing/browser
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Chromium path
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {chromium} from './testing/browser/node_modules/playwright/index.mjs';
          fs.appendFileSync(process.env.GITHUB_ENV, 'CHROMIUM_PATH=' + chromium.executablePath() + '\n');
          JS
      - name: Citizen routes, portrait and landscape
        run: |
          node testing/citizen-layout/audit.mjs /tmp/citizen-layout.json
          node testing/citizen-layout/verify.mjs /tmp/citizen-layout.json
      - name: Versioned navigation cache isolation on shared citizen routes
        env:
          ROUTES: "/,/cidadao/,/mascotes/"
          WIDTHS: "320,390"
          CACHED_NAV_PATH: "/tmp/citizen-cached-nav.js"
        run: |
          git show c10773fba8010bf2f2c8f42433976cefffe64315:js/social-navigation.js > "$CACHED_NAV_PATH"
          node testing/citizen-layout/audit.mjs /tmp/citizen-cached-nav.json
          node testing/citizen-layout/verify.mjs /tmp/citizen-cached-nav.json
      - name: Shared routes with both account roles and classic scrollbars
        env:
          ROUTES: "/,/cidadao/,/mascotes/"
          WIDTHS: "320,390"
          SCROLLBAR_FIXTURE: "1"
        run: |
          for role in cidadao admin; do
            AUDIT_ROLE="$role" node testing/citizen-layout/audit.mjs "/tmp/citizen-shared-$role.json"
            node testing/citizen-layout/verify.mjs "/tmp/citizen-shared-$role.json"
            AUDIT_ROLE="$role" TEXT_SCALE=2 WIDTHS=320 node testing/citizen-layout/audit.mjs "/tmp/citizen-shared-$role-text200.json"
            node testing/citizen-layout/verify.mjs "/tmp/citizen-shared-$role-text200.json"
          done
      - name: Double text size and reflow
        env:
          TEXT_SCALE: "2"
          WIDTHS: "320"
        run: |
          node testing/citizen-layout/audit.mjs /tmp/citizen-text200.json
          node testing/citizen-layout/verify.mjs /tmp/citizen-text200.json
      - name: Existing manifestation and reduced viewport height
        env:
          DETAIL_FIXTURE: "1"
          KEYBOARD_FIXTURE: "1"
          ROUTES: "/cidadao/"
          WIDTHS: "320,360,390,412,844"
        run: |
          node testing/citizen-layout/audit.mjs /tmp/citizen-detail.json
          node testing/citizen-layout/verify.mjs /tmp/citizen-detail.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-citizen-layout
          path: |
            /tmp/citizen-*.json
            /tmp/citizen-*.png
