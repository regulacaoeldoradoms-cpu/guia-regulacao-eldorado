name: Validar checklist rápido da recepção

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-reception-fast-checklist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar sintaxe
        run: |
          node --check js/reception-app.js
          node --check js/reception-ux.js
          node --check js/reception-clinical-checklist.js
          node --check js/reception-print-v6.js
      - name: Conferir integração
        run: |
          grep -q 'reception-fast-checklist.css?v=20260906-1' recepcao/index.html
          grep -q 'reception-ux.js?v=20260906-1' recepcao/index.html
          grep -q 'reception-clinical-checklist.js?v=20260906-1' recepcao/index.html
          grep -q 'reception-print-v6.js?v=20260906-1' recepcao/index.html
          ! grep -q 'reception-psychology-checklist.js' recepcao/index.html
          grep -q 'informacoesObrigatorias' js/reception-clinical-checklist.js
          grep -q 'subprotocol?.obrigatorias' js/reception-clinical-checklist.js
          grep -q 'Informações obrigatórias por padrão no encaminhamento' js/reception-clinical-checklist.js
          grep -q 'sem interpretar ou avaliar clinicamente' js/reception-clinical-checklist.js
          grep -q 'histórico clínico' js/reception-clinical-checklist.js
          grep -q 'qualidade de vida' js/reception-clinical-checklist.js
          grep -q 'diagnóstico psiquiátrico' js/reception-clinical-checklist.js
          grep -q 'medicações' js/reception-clinical-checklist.js
          grep -q 'substâncias psicoativas' js/reception-clinical-checklist.js
          grep -q 'Obrigatório por padrão' js/reception-ux.js
          grep -q 'Depende do caso' js/reception-ux.js
          grep -q 'Complementar' js/reception-ux.js
          grep -q "content: 'OBRIGATÓRIO'" css/reception-fast-checklist.css
          grep -q "content: 'DEPENDE DO CASO'" css/reception-fast-checklist.css
          grep -q "content: 'COMPLEMENTAR'" css/reception-fast-checklist.css
          grep -q 'printMissingItems' js/reception-print-v6.js
