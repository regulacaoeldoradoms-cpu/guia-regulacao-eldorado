name: Validar gestão de usuários

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-users:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar sintaxe
        run: |
          node --check worker/auth-management-v2.js
          node --check worker/auth-management-flex.js
          node --check worker/profile-photo.js
          node --check worker/role-migration.js
          node --check worker/index.js
          node --check js/auth-client.js
          node --check js/account.js
          node --check js/admin-users.js
          node --check js/home.js
          node --check js/login.js
          node --check js/signup.js
      - name: Conferir arquivos e rotas
        run: |
          test -f conta/index.html
          test -f cadastro/index.html
          test -f cidadao/index.html
          test -f admin/usuarios/index.html
          test -f css/account-admin.css
          test -f css/profile-account-link.css
          test -f worker/profile-photo.js
          grep -q '/api/auth/change-password' worker/auth-management-v2.js
          grep -q '/api/auth/register' worker/auth-management-v2.js
          grep -q '/api/auth/security' worker/auth-management-v2.js
          grep -q '/api/admin/users' worker/auth-management-v2.js
          grep -q 'PBKDF2' worker/auth-management-v2.js
          grep -q 'AUTH_DB' worker/auth-management-v2.js
          grep -q 'session_version' worker/auth-management-v2.js
          grep -q 'must_change_password' worker/auth-management-v2.js
          grep -q '/api/auth/profile' worker/profile-photo.js
          grep -q 'avatar_data' worker/profile-photo.js
          grep -q 'updateProfilePhoto' js/auth-client.js
          grep -q 'mountPortalAvatar' js/auth-client.js
          grep -q 'ensurePortalAccountArea' js/auth-client.js
          grep -q "area.href = '/conta/'" js/auth-client.js
          grep -q 'portal-account-area' css/profile-account-link.css
          grep -q 'primeiro-acesso' js/account.js
          grep -q 'Foto do perfil' conta/index.html
          grep -q 'E-mail de segurança' conta/index.html
          grep -q 'auth-client.js?v=20260815-1' conta/index.html
          grep -q 'enforcement: true' js/auth-config.js
          grep -q "homePath: '/'" js/auth-config.js
          grep -q 'AUTH_ENFORCE_AI = "true"' worker/wrangler.toml
          grep -q 'binding = "AUTH_DB"' worker/wrangler.toml
          grep -q 'database_name = "portal-regulacao-users"' worker/wrangler.toml
          grep -q 'Usuários e acessos' admin/usuarios/index.html
          grep -q 'Alterar senha' conta/index.html
      - name: Conferir hierarquia de permissões
        run: |
          grep -q "AUTH_ROLES = new Set(\['medico', 'recepcao', 'coordenacao', 'cidadao', 'admin'\])" worker/auth-management-v2.js
          grep -q "COUNCIL_ROLES = new Set(\['', 'membro', 'presidente'\])" worker/auth-management-v2.js
          grep -q "actorRole === 'admin'" worker/auth-management-v2.js
          grep -q "actorRole === 'coordenacao'" worker/auth-management-v2.js
          grep -q "new Set(\['medico', 'recepcao'\])" worker/auth-management-v2.js
          grep -q "Somente o Desenvolvedor pode atribuir funções do Conselho" worker/auth-management-v2.js
          grep -q 'AUTH_DEVELOPER_USERNAMES' worker/role-migration.js
          grep -q "SET role = 'coordenacao'" worker/role-migration.js
          grep -q 'Coordenação' admin/usuarios/index.html
          grep -q 'Presidente do Conselho' admin/usuarios/index.html
      - name: Impedir credenciais reais no repositório
        run: |
          if grep -R -E '"password"\s*:\s*"[0-9]{6,}"' worker js admin conta cadastro cidadao conselho; then
            echo 'Possível senha real encontrada no repositório.'
            exit 1
          fi
