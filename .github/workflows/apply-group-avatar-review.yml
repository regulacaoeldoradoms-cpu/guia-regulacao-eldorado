name: Aplicar revisão de foto e notificações dos grupos
on:
  push:
    branches: [feat/chat-groups-reviewed-20261008]
    paths: [.github/workflows/apply-group-avatar-review.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/feat/chat-groups-reviewed-20261008'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Aplicar a revisão validada sem alterar produção ou workflows
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = '36698ddc53978767731543ddb7618090bcf03469'
          test "$(git hash-object .github/avatar-push-review.patch)" = 'fd85de955664f91a8465eaca6c1412b06282f23e'
          git apply --check .github/avatar-push-review.patch
          git apply .github/avatar-push-review.patch
          node --check worker/chat-groups.js
          node --check js/portal-chat-groups.js
          npm --prefix worker run check
          npm --prefix worker test
          git rm -- .github/avatar-push-review.patch
          git add --all
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(chat): fotos leves e push somente para membros aceitos'
          test "$(git ls-remote origin refs/heads/feat/chat-groups-reviewed-20261008 | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/feat/chat-groups-reviewed-20261008
