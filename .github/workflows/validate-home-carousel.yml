name: Home tools carousel
on:
  pull_request:
    paths:
      - index.html
      - css/home-tools-carousel.css
      - css/citizen-readable-layout.css
      - css/citizen-mobile-navigation.css
      - css/portal.css
      - css/portal-interactions.css
      - css/social.css
      - css/home-mobile.css
      - css/home-chat-button.css
      - css/home-mobile-direct.css
      - css/portal-chat.css
      - js/home.js
      - js/citizen-mobile-shell.js
      - css/citizen-mobile-shell.css
      - js/home-mobile-composition.js
      - js/home-social-presentation.js
      - js/home-mobile-direct.js
      - js/citizen-layout.js
      - js/citizen-mobile-navigation.js
      - js/social-home.js
      - js/social-feed.js
      - js/tools-catalog.js
      - js/social-navigation.js
      - js/portal-chat.js
      - js/portal-chat-groups.js
      - portal-sw.js
      - testing/citizen-layout/**
      - .github/workflows/validate-home-carousel.yml
permissions:
  contents: read
jobs:
  synthetic-home:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock --no-audit --no-fund
        working-directory: testing/browser
      - run: npx playwright install --with-deps chromium
        working-directory: testing/browser
      - name: Long synthetic feed, touch viewport, keyboard and preferences
        env:
          HOME_CAROUSEL: '1'
          ROUTES: '/'
          WIDTHS: '320,360,390'
        run: |
          export CHROMIUM_PATH=$(node --input-type=module -e "import {chromium} from './testing/browser/node_modules/playwright/index.mjs';process.stdout.write(chromium.executablePath())")
          AUDIT_ROLE=admin AUDIT_THEME=dark node testing/citizen-layout/audit.mjs /tmp/home-carousel-dark.json
          node testing/citizen-layout/verify.mjs /tmp/home-carousel-dark.json
          AUDIT_ROLE=cidadao AUDIT_THEME=light node testing/citizen-layout/audit.mjs /tmp/home-carousel-citizen.json
          node testing/citizen-layout/verify.mjs /tmp/home-carousel-citizen.json
      - name: Accessible icons and reachable actions with 200 percent text
        env:
          HOME_CAROUSEL: '1'
          ROUTES: '/'
          WIDTHS: '320,390'
          TEXT_SCALE: '2'
        run: |
          export CHROMIUM_PATH=$(node --input-type=module -e "import {chromium} from './testing/browser/node_modules/playwright/index.mjs';process.stdout.write(chromium.executablePath())")
          AUDIT_ROLE=admin AUDIT_THEME=dark node testing/citizen-layout/audit.mjs /tmp/home-carousel-dark-text200.json
          node testing/citizen-layout/verify.mjs /tmp/home-carousel-dark-text200.json
          AUDIT_ROLE=cidadao AUDIT_THEME=light node testing/citizen-layout/audit.mjs /tmp/home-carousel-citizen-text200.json
          node testing/citizen-layout/verify.mjs /tmp/home-carousel-citizen-text200.json
      - name: Citizen Home and Direct scenes with native session persistence
        env:
          ROLES: 'cidadao'
          SESSION_BRIDGE: 'protocol'
        run: |
          export CHROMIUM_PATH=$(node --input-type=module -e "import {chromium} from './testing/browser/node_modules/playwright/index.mjs';process.stdout.write(chromium.executablePath())")
          WIDTHS=320 THEMES=light TEXT_SCALE=1,2 node testing/citizen-layout/home-social-scenes.mjs /tmp/home-social-scenes-320-light
          WIDTHS=390 THEMES=light TEXT_SCALE=1,2 node testing/citizen-layout/home-social-scenes.mjs /tmp/home-social-scenes-390-light
          WIDTHS=390 THEMES=dark TEXT_SCALE=2 node testing/citizen-layout/home-social-scenes.mjs /tmp/home-social-scenes-390-dark
      - name: Citizen retained routes and cache/feed/session regressions
        run: |
          export CHROMIUM_PATH=$(node --input-type=module -e "import {chromium} from './testing/browser/node_modules/playwright/index.mjs';process.stdout.write(chromium.executablePath())")
          node testing/citizen-layout/mobile-shell.mjs
          node testing/citizen-layout/mobile-shell-regressions.mjs
          node testing/citizen-layout/mobile-shell-prewarm.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home-carousel-synthetic
          path: |
            /tmp/home-carousel-*
            /tmp/home-social-scenes-*/
            .local/mobile-shell-tests/
            .local/mobile-shell-regressions/
            .local/mobile-shell-prewarm/
