name: Validar edição cadastral da Telemedicina

on:
  pull_request:
    paths:
      - 'telemedicina/index.html'
      - 'js/telemedicina-edit.js'
      - 'css/telemedicina-mobile-v13.css'
      - 'worker/telemedicine-router-v2.js'
      - 'worker/index.js'
      - 'docs/TELEMEDICINA.md'
      - '.github/workflows/validate-telemedicine-edit.yml'
  push:
    branches: [main]
    paths:
      - 'telemedicina/index.html'
      - 'js/telemedicina-edit.js'
      - 'css/telemedicina-mobile-v13.css'
      - 'worker/telemedicine-router-v2.js'
      - 'worker/index.js'
      - 'docs/TELEMEDICINA.md'
      - '.github/workflows/validate-telemedicine-edit.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Conferir arquivos e sintaxe
        shell: bash
        run: |
          set -euo pipefail
          test -f js/telemedicina-edit.js
          test -f css/telemedicina-mobile-v13.css
          test -f worker/telemedicine-router-v2.js
          node --check js/telemedicina-edit.js
          node --input-type=module --check < worker/telemedicine-router-v2.js
          node --input-type=module --check < worker/index.js
      - name: Conferir autorização e integridade das correções
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "telemedicine-router-v2.js" worker/index.js
          grep -Fq "user.role === 'admin'" worker/telemedicine-router-v2.js
          grep -Fq "user.role === 'recepcao' && await telemedicineAccessFor" worker/telemedicine-router-v2.js
          grep -Fq "const patientNameMatch = url.pathname.match" worker/telemedicine-router-v2.js
          grep -Fq "const specialtyMatch = url.pathname.match" worker/telemedicine-router-v2.js
          grep -Fq "status: 409" worker/telemedicine-router-v2.js
          grep -Fq "correctionHistory" worker/telemedicine-router-v2.js
          grep -Fq "firestoreDelete" worker/telemedicine-router-v2.js
          grep -Fq "async function mergeSpecialtyFollowups" worker/telemedicine-router-v2.js
          grep -Fq "function newerFollowup" worker/telemedicine-router-v2.js
          grep -Fq "mergedFromFollowups" worker/telemedicine-router-v2.js
          grep -Fq "return mergeSpecialtyFollowups" worker/telemedicine-router-v2.js
          grep -Fq "telemedicina-edit.js?v=20260902-1" telemedicina/index.html
          grep -Fq "telemedicina-mobile-v13.css?v=20260903-2" telemedicina/index.html
          grep -Fq "data-telemedicine-edit" js/telemedicina-edit.js
          grep -Fq "REUMATOLOGIA" js/telemedicina-edit.js
          grep -Fq "line-clamp: unset" js/telemedicina-edit.js
          grep -Fq "data-telemedicine-edit=\"patient\"" css/telemedicina-mobile-v13.css
          grep -Fq "width: 24px" css/telemedicina-mobile-v13.css
          grep -Fq "flex-wrap: wrap" css/telemedicina-mobile-v13.css
          grep -Fq "position: static" css/telemedicina-mobile-v13.css
          grep -Fq ".telemedicine-page .telemedicine-row[hidden]" css/telemedicina-mobile-v13.css
          grep -Fq "display: none !important" css/telemedicina-mobile-v13.css
          grep -Fq "Correção de nome e especialidade" docs/TELEMEDICINA.md
          grep -Fq "unificação controlada" docs/TELEMEDICINA.md
          grep -Fq "nunca é inferida por semelhança de texto" docs/TELEMEDICINA.md
      - name: Conferir privacidade do código versionado
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E '\b(CNS|CPF)\b' js/telemedicina-edit.js worker/telemedicine-router-v2.js; then
            echo 'Identificador pessoal proibido no código da edição cadastral.' >&2
            exit 1
          fi
