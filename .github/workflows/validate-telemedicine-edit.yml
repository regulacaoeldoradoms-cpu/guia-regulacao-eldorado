name: Validar edição cadastral da Telemedicina

on:
  pull_request:
    paths:
      - 'telemedicina/index.html'
      - 'js/telemedicina-edit.js'
      - 'worker/telemedicine-router-v2.js'
      - 'worker/index.js'
      - 'docs/TELEMEDICINA.md'
      - '.github/workflows/validate-telemedicine-edit.yml'
  push:
    branches: [main]
    paths:
      - 'telemedicina/index.html'
      - 'js/telemedicina-edit.js'
      - 'worker/telemedicine-router-v2.js'
      - 'worker/index.js'
      - 'docs/TELEMEDICINA.md'
      - '.github/workflows/validate-telemedicine-edit.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Conferir arquivos e sintaxe
        shell: bash
        run: |
          set -euo pipefail
          test -f js/telemedicina-edit.js
          test -f worker/telemedicine-router-v2.js
          node --check js/telemedicina-edit.js
          node --input-type=module --check < worker/telemedicine-router-v2.js
          node --input-type=module --check < worker/index.js
      - name: Conferir autorização e integridade das correções
        shell: bash
        run: |
          set -euo pipefail
          grep -q "telemedicine-router-v2.js" worker/index.js
          grep -q "user.role === 'admin'" worker/telemedicine-router-v2.js
          grep -q "user.role === 'recepcao' && await telemedicineAccessFor" worker/telemedicine-router-v2.js
          grep -q "/patients\\/.*\\/name" worker/telemedicine-router-v2.js
          grep -q "/followups\\/.*\\/specialty" worker/telemedicine-router-v2.js
          grep -q "status: 409" worker/telemedicine-router-v2.js
          grep -q "correctionHistory" worker/telemedicine-router-v2.js
          grep -q "firestoreDelete" worker/telemedicine-router-v2.js
          grep -q "telemedicina-edit.js?v=20260902-1" telemedicina/index.html
          grep -q "data-telemedicine-edit" js/telemedicina-edit.js
          grep -q "REUMATOLOGIA" js/telemedicina-edit.js
          grep -q "line-clamp: unset" js/telemedicina-edit.js
          grep -q "Correção de nome e especialidade" docs/TELEMEDICINA.md
      - name: Conferir privacidade do código versionado
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E '\\b(CNS|CPF)\\b' js/telemedicina-edit.js worker/telemedicine-router-v2.js; then
            echo 'Identificador pessoal proibido no código da edição cadastral.' >&2
            exit 1
          fi
