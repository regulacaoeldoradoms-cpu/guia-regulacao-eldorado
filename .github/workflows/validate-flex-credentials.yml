name: Validar credenciais do portal

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-credentials:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar sintaxe
        run: |
          node --check worker/auth-management-v2.js
          node --check worker/auth-management-flex.js
          node --check worker/index.js
          node --check js/auth-client.js
          node --check js/credential-input.js
          node --check js/account.js
          node --check js/signup.js
      - name: Conferir regras de credenciais
        run: |
          grep -q "auth-management-flex.js" worker/index.js
          grep -q "PASSWORD_MIN_LENGTH = 8" worker/auth-management-v2.js
          grep -q "PBKDF2_ITERATIONS = 100000" worker/auth-management-v2.js
          grep -q "role: 'cidadao'" worker/auth-management-v2.js
          grep -q "selfRegistered: true" worker/auth-management-v2.js
          grep -q "email_verified" worker/auth-management-v2.js
          grep -q "accept_friend_requests" worker/auth-management-v2.js
          grep -q "AUTH_REQUIRE_EMAIL_VERIFICATION" worker/auth-management-v2.js
          grep -q "minlength=\"8\"" cadastro/index.html
          grep -q "minlength=\"8\"" conta/index.html
          grep -q "registerCitizen" js/auth-client.js
          grep -q "getSecurity" js/auth-client.js
          grep -q "sendEmailVerification" js/auth-client.js
          if grep -R -E 'password["'"']?\s*[:=]\s*["'"'][^"'"']{8,}' js worker '*.html' 2>/dev/null; then
            echo 'Possível senha literal exposta no repositório.'
            exit 1
          fi
