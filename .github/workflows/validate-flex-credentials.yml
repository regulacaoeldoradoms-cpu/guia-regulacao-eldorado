name: Validar credenciais flexíveis

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-flex-credentials:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar sintaxe
        run: |
          node --check worker/auth-management-flex.js
          node --check worker/index.js
          node --check js/credential-input.js
          node --check js/account.js
      - name: Conferir regras simplificadas
        run: |
          grep -q "auth-management-flex.js" worker/index.js
          grep -q "PBKDF2_ITERATIONS = 100000" worker/auth-management-flex.js
          grep -q "if (!password.length) return 'Informe uma senha.'" worker/auth-management-flex.js
          grep -q "replace(/\\s+/g, '.')" worker/auth-management-flex.js
          grep -q 'credential-input.js' admin/usuarios/index.html
          if grep -q 'minlength="8"' admin/usuarios/index.html conta/index.html; then
            echo 'Ainda existe exigência de 8 caracteres nas telas de senha.'
            exit 1
          fi
          if grep -q 'pelo menos 8 caracteres' js/account.js admin/usuarios/index.html conta/index.html; then
            echo 'Ainda existe mensagem de senha mínima no portal.'
            exit 1
          fi