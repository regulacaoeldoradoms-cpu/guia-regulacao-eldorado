name: Validar carregamento resiliente dos protocolos

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-protocol-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar sintaxe e arquivos
        run: |
          test -f js/protocol-source-resilience.js
          test -f data/protocol-source.html
          node --check js/protocol-source-resilience.js
          node --check js/medical-app.js
          node --check js/reception-app.js
          grep -q 'const PROTOCOLOS' data/protocol-source.html
          grep -q 'const FOOTER_IMG' data/protocol-source.html
      - name: Conferir integração antes dos aplicativos
        run: |
          grep -q '/js/protocol-source-resilience.js?v=20260817-2' medico/index.html
          grep -q '/js/protocol-source-resilience.js?v=20260817-2' recepcao/index.html
          python - <<'PY'
          from pathlib import Path
          for path, app in [('medico/index.html', '/js/medical-app.js'), ('recepcao/index.html', '/js/reception-app.js')]:
              text = Path(path).read_text(encoding='utf-8')
              assert text.index('/js/protocol-source-resilience.js') < text.index(app), f'fallback deve carregar antes de {app} em {path}'
          PY
      - name: Conferir base local principal e redundâncias
        run: |
          grep -q "LOCAL_SOURCE = '/data/protocol-source.html'" js/protocol-source-resilience.js
          grep -q "tryTextSource(LOCAL_SOURCE, 'site-local'" js/protocol-source-resilience.js
          grep -q 'cdn.jsdelivr.net/gh/' js/protocol-source-resilience.js
          grep -q 'api.github.com/repos/' js/protocol-source-resilience.js
          grep -q 'raw.githubusercontent.com/' js/protocol-source-resilience.js
          grep -q 'localStorage.getItem' js/protocol-source-resilience.js
          grep -q 'localStorage.setItem' js/protocol-source-resilience.js
          grep -q 'const PROTOCOLOS' js/protocol-source-resilience.js
          grep -q 'const FOOTER_IMG' js/protocol-source-resilience.js
          python - <<'PY'
          from pathlib import Path
          text = Path('js/protocol-source-resilience.js').read_text(encoding='utf-8')
          runtime = text[text.index('async function resilientProtocolFetch()'):]
          local = runtime.index("tryTextSource(LOCAL_SOURCE, 'site-local'")
          cache = runtime.index('const cached = cachedSource()')
          cdn = runtime.index("tryTextSource(CDN_SOURCE, 'jsdelivr')")
          raw = runtime.index("tryTextSource(RAW_SOURCE, 'github-raw')")
          api = runtime.index('() => tryGitHubApi()')
          assert local < cache < cdn < raw < api, 'ordem de redundância da base protocolar foi alterada'
          PY
