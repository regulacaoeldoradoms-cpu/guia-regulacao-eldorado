name: Validar Telemedicina Atômica V29

on:
  pull_request:
    paths:
      - 'worker/firestore-atomic-v29.js'
      - 'worker/telemedicine-router-v2.js'
      - 'worker/tests/firestore-atomic-v29.test.mjs'
      - 'js/telemedicina-altas-v29.js'
      - 'js/telemedicina-altas-v30.js'
      - 'css/telemedicina-altas-v30.css'
      - 'telemedicina/index.html'
      - 'docs/TELEMEDICINA-SALVAMENTO-ATOMICO-E-ALTAS-V29.md'
      - '.github/workflows/validate-telemedicine-atomic-v29.yml'
  push:
    branches: [main]
    paths:
      - 'worker/firestore-atomic-v29.js'
      - 'worker/telemedicine-router-v2.js'
      - 'worker/tests/firestore-atomic-v29.test.mjs'
      - 'js/telemedicina-altas-v29.js'
      - 'js/telemedicina-altas-v30.js'
      - 'css/telemedicina-altas-v30.css'
      - 'telemedicina/index.html'
      - 'docs/TELEMEDICINA-SALVAMENTO-ATOMICO-E-ALTAS-V29.md'
      - '.github/workflows/validate-telemedicine-atomic-v29.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Conferir sintaxe
        run: |
          node --input-type=module --check < worker/firestore-atomic-v29.js
          node --input-type=module --check < worker/telemedicine-router-v2.js
          node --check js/telemedicina-altas-v30.js
      - name: Conferir commit atômico
        run: node --test worker/tests/firestore-atomic-v29.test.mjs
      - name: Conferir contrato do salvamento
        run: |
          grep -q 'documents:commit' worker/firestore-atomic-v29.js
          grep -q 'firestoreAtomicCommit' worker/telemedicine-router-v2.js
          grep -q "consultationCreate = url.pathname === '/api/telemedicina/consultations'" worker/telemedicine-router-v2.js
          grep -q 'telemedicine_patients' worker/telemedicine-router-v2.js
          grep -q 'telemedicine_events' worker/telemedicine-router-v2.js
          grep -q 'telemedicine_followups' worker/telemedicine-router-v2.js
      - name: Conferir fila de Altas atual
        run: |
          grep -q 'id="dischargeQueue"' telemedicina/index.html
          grep -q '>Altas</button>' telemedicina/index.html
          grep -q 'id="normalizeSpecialties" hidden' telemedicina/index.html
          grep -q 'data-status-filter="CONCLUÍDO"' telemedicina/index.html
          grep -q '<option value="CONCLUÍDO">Altas</option>' telemedicina/index.html
          grep -q 'telemedicina-altas-v30.js?v=20260909-2' telemedicina/index.html
          grep -q "COMPLETED_STATUS = 'CONCLUÍDO'" js/telemedicina-altas-v30.js
          grep -q 'data-atomic-save="v29"' telemedicina/index.html
          grep -q 'data-discharge-queue="v31"' telemedicina/index.html
      - name: Conferir regressões dos desfechos
        run: node --test worker/tests/telemedicine-outcomes-v25.test.mjs
