name: Validar Central de Documentos — Fases 1–5E (preparo)

on:
  pull_request:
    paths:
      - 'documentos/**'
      - 'css/documents.css'
      - 'js/documents.js'
      - 'js/document-cache.js'
      - 'js/document-editor.js'
      - 'js/document-viewer.js'
      - 'js/admin-users.js'
      - 'admin/usuarios/index.html'
      - 'js/tools-catalog.js'
      - 'js/portal-performance.js'
      - 'portal-sw.js'
      - 'worker/document-*.js'
      - 'worker/additional-roles.js'
      - 'worker/documents-router.js'
      - 'worker/homologation-4d.js'
      - 'worker/homologation-5e.js'
      - 'worker/tests/homologation-4d.test.mjs'
      - 'worker/tests/homologation-5e.test.mjs'
      - 'worker/migrations/central-documents-homologation-4d.sql'
      - 'worker/auth-management-flex.js'
      - 'worker/auth-management-v2.js'
      - 'worker/index.js'
      - 'worker/system-readiness.js'
      - 'worker/wrangler.toml'
      - 'worker/package.json'
      - 'worker/tests/documents-*.test.mjs'
      - 'worker/tests/document-ai*.test.mjs'
      - 'worker/tests/document-editor.test.mjs'
      - 'worker/tests/developer-self-edit-session.test.mjs'
      - 'scripts/build-central-docs-staging.mjs'
      - 'scripts/central-docs/recuperar-preparo-5e.mjs'
      - 'scripts/central-docs/recuperar-preparo-5e.test.mjs'
      - 'testing/central-docs/**'
      - 'testing/central-docs-ai/**'
      - 'testing/browser/**'
      - 'vendor/pdf-lib/**'
      - 'docs/CENTRAL-DOCUMENTOS-**'
      - '.github/workflows/validate-central-documents-phase1.yml'
  push:
    branches: [ main ]
    paths:
      - 'documentos/**'
      - 'css/documents.css'
      - 'js/documents.js'
      - 'js/document-cache.js'
      - 'js/document-editor.js'
      - 'js/document-viewer.js'
      - 'js/admin-users.js'
      - 'admin/usuarios/index.html'
      - 'worker/document-*.js'
      - 'worker/additional-roles.js'
      - 'worker/documents-router.js'
      - 'worker/homologation-4d.js'
      - 'worker/tests/homologation-4d.test.mjs'
      - 'worker/migrations/central-documents-homologation-4d.sql'
      - 'worker/auth-management-flex.js'
      - 'worker/auth-management-v2.js'
      - 'worker/tests/documents-*.test.mjs'
      - 'worker/tests/document-ai*.test.mjs'
      - 'worker/tests/document-editor.test.mjs'
      - 'worker/tests/developer-self-edit-session.test.mjs'
      - 'scripts/build-central-docs-staging.mjs'
      - 'scripts/central-docs/recuperar-preparo-5e.mjs'
      - 'scripts/central-docs/recuperar-preparo-5e.test.mjs'
      - 'testing/central-docs/**'
      - 'testing/browser/**'
      - 'vendor/pdf-lib/**'
      - 'portal-sw.js'
      - 'docs/CENTRAL-DOCUMENTOS-**'
      - '.github/workflows/validate-central-documents-phase1.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validar sintaxe e suíte do Worker
        working-directory: worker
        run: |
          npm run check
          node --check homologation-4d.js
          node --check homologation-5e.js
          npm test

      - name: Conferir navegação, cache, editor e sincronização segura
        run: |
          test -f documentos/index.html
          test -f css/documents.css
          test -f js/documents.js
          test -f js/document-background.js
          test -f docs/CENTRAL-DOCUMENTOS-FASE-6.md
          test -f worker/additional-roles.js
          test -f worker/document-access.js
          test -f worker/document-ai-prompts.js
          test -f worker/document-ai.js
          test -f worker/document-ai-provider.js
          test -f worker/document-drive.js
          test -f worker/documents-router.js
          test -f worker/homologation-5e.js
          test -f testing/central-docs-ai/phase5e-harness.html
          test -f testing/central-docs-ai/phase5e-harness.js
          grep -q "/api/documents/ai/config" worker/documents-router.js
          grep -q "/api/documents/ai/page/classify" worker/documents-router.js
          grep -q "/api/documents/ai/page/extract" worker/documents-router.js
          grep -q "/api/documents/ai/chat" worker/documents-router.js
          grep -q "phase5e-synthetic-v1" worker/homologation-5e.js
          grep -q "AI_HOMOLOGATION_ROUTE_DENIED" worker/homologation-5e.js
          grep -q "normalizeDocumentAiExtraction" worker/document-ai.js
          grep -q "analyzeDocumentAiPage" worker/document-ai-provider.js
          grep -q "@cf/moondream/moondream3.1-9B-A2B" worker/document-ai-provider.js
          grep -q "@cf/google/gemma-4-26b-a4b-it" worker/document-ai-provider.js
          grep -q "@cf/qwen/qwen3.8-27b" worker/document-ai-provider.js
          grep -q "env.AI.run" worker/document-ai-provider.js
          ! grep -q "generativelanguage.googleapis.com" worker/document-ai-provider.js
          ! grep -q "GEMINI_API_KEY" worker/document-ai-provider.js
          grep -q "exportPageImage" js/document-viewer.js
          grep -q "function getPageCount" js/document-viewer.js
          grep -q 'id="documentsAiExtractDocumentButton"' documentos/index.html
          grep -q "extractWholeDocumentAi" js/documents.js
          grep -q "const concurrency = Math.min(5, pageCount)" js/documents.js
          grep -q "maxEdge: 1800" js/documents.js
          grep -q "mimeType: 'image/png'" js/documents.js
          grep -q "quality: 0.92" js/documents.js
          grep -q "PROMPT_ANALISE_REGULACAO_V1" worker/document-ai-prompts.js
          grep -q "PROMPT_ANALISE_REGULACAO_COMPACTA_V1" worker/document-ai-prompts.js
          grep -q "phase5e-v8c2-semantic-json" worker/document-ai.js
          grep -q "CONTROLE DE ATENDIMENTO" worker/document-ai-prompts.js
          grep -q "RECEITA SIMPLES" worker/document-ai-prompts.js
          grep -q "PROMPT_CLASSIFICACAO_PAGINAS_V1" worker/document-ai-prompts.js
          grep -q "PROMPT_EXTRACAO_REGULACAO_V1" worker/document-ai-prompts.js
          grep -q "PROMPT_DOCUMENT_CHAT_V1" worker/document-ai-prompts.js
          grep -q "chatDocumentAi" worker/document-ai-provider.js
          grep -q 'DOCUMENTS_AI_ENABLED = "false"' worker/wrangler.toml
          grep -q 'DOCUMENTS_AI_PROCESSING_ENABLED = "false"' worker/wrangler.toml
          grep -q 'DOCUMENTS_AI_BACKGROUND_ENABLED = "false"' worker/wrangler.toml
          grep -q 'DOCUMENTS_AI_FREE_ONLY = "true"' worker/wrangler.toml
          grep -q 'DOCUMENTS_AI_FAST_VISION_ENABLED = "false"' worker/wrangler.toml
          grep -q 'DOCUMENTS_AI_FAST_VISION_MODEL = "@cf/moondream/moondream3.1-9B-A2B"' worker/wrangler.toml
          grep -q 'DOCUMENTS_AI_PRIMARY_MODEL = "@cf/google/gemma-4-26b-a4b-it"' worker/wrangler.toml
          grep -q 'DOCUMENTS_AI_FALLBACK_MODELS = "@cf/qwen/qwen3.8-27b"' worker/wrangler.toml
          grep -q 'id="documentAiButton"' documentos/index.html
          grep -q 'id="documentsAiPanel"' documentos/index.html
          grep -q "https://www.googleapis.com/auth/drive" worker/document-drive.js
          grep -q "Cache-Control.*no-store" worker/documents-router.js
          grep -q "URL.revokeObjectURL" js/documents.js
          grep -q "Somente leitura" documentos/index.html
          grep -q "Gerenciar cargos e acessos" documentos/index.html
          grep -q "Cargos/funções adicionais (acumuláveis)" admin/usuarios/index.html
          ! grep -q "Acessos à Central" documentos/index.html
          ! grep -R -E "localStorage|sessionStorage|indexedDB" js/documents.js
          ! grep -R -E "localStorage|sessionStorage|indexedDB" js/document-background.js
          grep -q "PortalDocumentBackground" js/document-background.js
          grep -q "document_background_task" js/portal-observability.js
          grep -q "document_background_task" worker/observability.js
          node --check js/document-background.js
          node --check js/documents.js
          node --check js/document-viewer.js
          node --check testing/central-docs-ai/phase5e-harness.js
          node --check js/document-cache.js
          node --check js/document-editor.js
          node --check js/document-viewer.js
          node --check js/admin-users.js
          node --check portal-sw.js
          node --check scripts/central-docs/recuperar-preparo-5e.mjs
          node --test scripts/central-docs/recuperar-preparo-5e.test.mjs
          grep -q "PORTAL_DOCUMENT_STREAM_REGISTER" portal-sw.js
          grep -q "pdf_first_page_visible" js/documents.js
          grep -q "AES-GCM" js/document-cache.js
          grep -q "HKDF" js/document-cache.js
          grep -q "/vendor/pdf-lib/pdf-lib.min.js" js/document-editor.js
          test -s vendor/pdf-lib/pdf-lib.min.js
          test -s vendor/pdf-lib/LICENSE.md
          grep -q "PDFJS_VERSION = '6.3.289'" js/document-viewer.js
          grep -q "enableScripting: false" js/document-viewer.js
          grep -q "isEvalSupported: false" js/document-viewer.js
          test -s vendor/pdfjs/pdf.min.mjs
          test -s vendor/pdfjs/pdf.worker.min.mjs
          test -s vendor/pdfjs/LICENSE
          ! grep -R -F "cdn.jsdelivr.net" documentos/index.html js/document-editor.js
          grep -q "sha512-z8IYLHO8bTgFqj+yrPyIJnzBDf7DDhWwiEsk4sY+Oe6J2M+WQequeGS7qioI5vT6rXgVRb4K1UVQC5ER7MKzKQ==" js/document-editor.js
          grep -qi "sincronizadas automaticamente" documentos/index.html
          grep -q "editDocumentAiPermission" admin/usuarios/index.html
          grep -q "editDocumentPdfPermission" admin/usuarios/index.html
          grep -q "pdf_edit_completed" js/documents.js
          grep -q "drive_sync_started" js/documents.js
          grep -q "drive_sync_completed" js/documents.js
          grep -q "drive_sync_failed" js/documents.js
          grep -q "DRIVE_AUTO_SYNC_IDLE_MS = 1000" js/documents.js
          grep -q "Drive_normal.png" css/documents.css
          grep -q "Drive_pendente.png" css/documents.css
          grep -q "Drive_sincronizando.png" css/documents.css
          grep -q "Drive_sincronizado_1seg.png" css/documents.css
          grep -q "Drive_falha.png" css/documents.css
          grep -q "/api/documents/drive/sync/preflight" js/documents.js
          grep -q "/api/documents/drive/sync/start" js/documents.js
          grep -q "DOCUMENTS_DRIVE_WRITE_ENABLED" worker/document-drive.js
          grep -q "DRIVE_VERSION_CONFLICT" worker/document-drive.js
          grep -q "keepForever" worker/document-drive.js
          ! grep -R -E "https://www.googleapis.com/upload/drive" js/document-editor.js js/documents.js documentos/index.html

      - name: Bloquear segredos e telemetria identificável
        run: |
          ! grep -R -E 'ya29\.[0-9A-Za-z_-]+' worker/document-*.js worker/documents-router.js js/documents.js
          ! grep -R -E 'GOCSPX-[0-9A-Za-z_-]+' worker/document-*.js worker/documents-router.js js/documents.js
          ! grep -R -E 'AIza[0-9A-Za-z_-]{20,}' worker/document-*.js worker/documents-router.js js/documents.js
          ! grep -R -E "capture\([^\n]*(fileId|filename|item\.name|item\.ref|searchQuery)" js/documents.js
          ! grep -R -E "GEMINI_API_KEY|DRIVE_TOKEN_ENCRYPTION_KEY|AUTH_SESSION_SECRET" documentos/index.html js/documents.js
