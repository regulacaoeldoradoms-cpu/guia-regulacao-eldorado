name: Validar chat interno do portal

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-chat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validar sintaxe
        run: |
          node --check worker/portal-chat-v2.js
          node --check worker/chat-groups.js
          node --check js/portal-chat-groups.js
          node --check worker/chat-realtime.js
          node --check worker/chat-realtime-do.js
          node --check worker/chat-send-atomic.js
          node --check worker/push-notifications.js
          node --check worker/index.js
          node --check js/portal-global-chat.js
          node --check js/portal-chat.js
          node --check js/portal-pwa.js
          node --check js/portal-chat-switch-optimizer.js
          node --check js/medical-portal-nav.js
          node --check portal-sw.js
          node --test worker/tests/global-chat.test.mjs
          node --test worker/tests/chat-realtime.test.mjs
          node --test worker/tests/chat-attention*.test.mjs
          node --test worker/tests/chat-presentation.test.mjs
          node --test worker/tests/chat-groups.test.mjs worker/tests/chat-group-notification-payload.test.mjs
      - name: Conferir integração profissional
        run: |
          test -f css/portal-chat.css
          grep -q 'html\[data-portal-theme="dark"\] \.portal-chat-body' css/portal-chat.css
          grep -q 'html\[data-portal-theme="dark"\] \.portal-chat-contact:hover' css/portal-chat.css
          grep -q 'html\[data-portal-theme="dark"\] \.portal-chat-message.mine' css/portal-chat.css
          grep -q "CHAT_CSS = '/css/portal-chat.css?v=20261008-chat-groups-1'" js/portal-global-chat.js
          grep -q "CHAT_SCRIPT = '/js/portal-chat.js?v=20261008-chat-groups-1'" js/portal-global-chat.js
          grep -q "CHAT_OPTIMIZER = '/js/portal-chat-switch-optimizer.js?v=20260928-global-1'" js/portal-global-chat.js
          test -f portal-sw.js
          test -f js/portal-chat-switch-optimizer.js
          grep -q "portal-chat-v2.js" worker/index.js
          grep -q "PROFESSIONAL_ROLES = new Set(\['medico', 'recepcao', 'coordenacao', 'telemedicina', 'admin'\])" worker/portal-chat-v2.js
          grep -q "decorateTelemedicineUsers" worker/portal-chat-v2.js
          grep -q "verifyPortalSessionToken" worker/portal-chat-v2.js
          grep -q "function validateChatSession" worker/portal-chat-v2.js
          ! grep -q "validatePortalSession(request" worker/portal-chat-v2.js
          grep -q "u.role IN ('medico','recepcao','coordenacao','admin')" worker/portal-chat-v2.js
          grep -q "/api/chat/presence" worker/portal-chat-v2.js
          grep -q "/api/chat/users" worker/portal-chat-v2.js
          grep -q "/api/chat/messages" worker/portal-chat-v2.js
          grep -q "/api/chat/delivery" worker/portal-chat-v2.js
          grep -q "/api/chat/realtime/health" worker/portal-chat-v2.js
          grep -q "/api/chat/realtime/ticket" worker/portal-chat-v2.js
          grep -q "/api/chat/typing" worker/portal-chat-v2.js
          grep -q "/api/chat/read" worker/portal-chat-v2.js
          grep -q "delivered_at TEXT" worker/portal-chat-v2.js
          grep -q "client_id TEXT" worker/portal-chat-v2.js
          grep -q "idx_chat_client_message" worker/portal-chat-v2.js
          grep -q "PORTAL_CHAT_SESSION_PUT" js/portal-chat.js
          grep -q "PORTAL_CHAT_SESSION_GET" js/portal-chat.js
          grep -q "keepalive: true" js/portal-chat.js
          grep -q "portal-chat-message-send-state" css/portal-chat.css
          grep -q "portal-chat-unread-divider" css/portal-chat.css
          grep -q "portal-chat-typing" css/portal-chat.css
          grep -q "new WebSocket" js/portal-chat.js
          grep -q "CHAT_REALTIME_SEND_ACK_TIMEOUT_MS = 1800" js/portal-chat.js
          grep -q "type: 'send'" js/portal-chat.js
          grep -q "type === 'send-ack'" js/portal-chat.js
          grep -q "type === 'send-error'" js/portal-chat.js
          grep -q "CHAT_EMOJIS = Object.freeze" js/portal-chat.js
          grep -q "id=\"portalChatEmojiButton\"" js/portal-chat.js
          grep -q "id=\"portalChatAttention\"" js/portal-chat.js
          grep -q "Chamar atenção" js/portal-chat.js
          grep -q "CHAT_ATTENTION_COOLDOWN_MS = 5000" js/portal-chat.js
          grep -q "CHAT_ATTENTION_EFFECT_MS = 1800" js/portal-chat.js
          grep -q "type: 'attention'" js/portal-chat.js
          grep -q "attention-cooldown" worker/chat-realtime-do.js
          grep -q "ATTENTION_COOLDOWN_MS = 5000" worker/chat-realtime-do.js
          grep -q "prefers-reduced-motion: reduce" css/portal-chat.css
          grep -q "portal-chat-emoji-grid" css/portal-chat.css
          grep -q "portal-chat-launcher.attention-hit" css/portal-chat.css
          grep -q "persistAtomicChatMessage" worker/chat-realtime-do.js
          grep -q "INSERT OR IGNORE INTO portal_chat_messages" worker/chat-send-atomic.js
          grep -q "sender.session_version = ?" worker/chat-send-atomic.js
          grep -q "X-Portal-Chat-Session-Version" worker/chat-realtime.js
          grep -q "CHAT_FALLBACK_POLL_MS = 4500" js/portal-chat.js
          grep -q 'name = "CHAT_REALTIME"' worker/wrangler.toml
          grep -q 'new_sqlite_classes = \["PortalChatRealtime"\]' worker/wrangler.toml
          grep -q "peekOnly" worker/portal-chat-v2.js
          grep -q "beforeId" worker/portal-chat-v2.js
          grep -q "MESSAGE_HISTORY_PAGE_SIZE = 120" worker/portal-chat-v2.js
          grep -q "preloadConversationsInBackground" js/portal-chat.js
          grep -q "MESSAGE_PRELOAD_PAGE_GUARD = 100" js/portal-chat.js
          grep -q "MESSAGE_PRELOAD_CONTACT_LIMIT = 2" js/portal-chat.js
          grep -q "CHAT_CONTACTS_REALTIME_REFRESH_MS = 120000" js/portal-chat.js
          grep -q "CHAT_HEARTBEAT_MS = 60000" js/portal-chat.js
          grep -q "citizenOnlyClause" worker/portal-chat-v2.js
          grep -q "LEFT JOIN social_users social ON social.auth_username = u.username" worker/portal-chat-v2.js
          ! grep -q "function socialHandleForUsername" worker/portal-chat-v2.js
          grep -q "messageCache = new Map" js/portal-chat.js
          grep -q "INSERT OR IGNORE INTO portal_chat_messages" worker/portal-chat-v2.js
          grep -q "X-Portal-Chat-Ack-Ms" worker/portal-chat-v2.js
          grep -q "Server-Timing" worker/portal-chat-v2.js
          grep -q "function chatSchemaReady" worker/portal-chat-v2.js
          grep -q "function chatContactAllowed" worker/portal-chat-v2.js
          grep -q "notifyUserPush" worker/portal-chat-v2.js
          grep -q "addEventListener('push'" portal-sw.js
          grep -q "/api/push/subscriptions" js/portal-pwa.js
          grep -q "Uso interno do portal" js/portal-chat.js
          grep -q "Notification.requestPermission" js/portal-chat.js
          grep -q "showNotification" js/portal-chat.js
          grep -q "serviceWorker.register('/portal-sw.js'" js/portal-chat.js
          grep -q "version: '20261008-chat-groups-1'" js/portal-chat.js
          grep -q "PortalChatSwitchOptimizer" js/portal-chat-switch-optimizer.js
          grep -q "CHAT_ROLES = new Set(\['medico', 'recepcao', 'coordenacao', 'telemedicina', 'admin', 'cidadao'\])" js/portal-chat.js
          grep -q "id=\"portalChatProfileLink\"" js/portal-chat.js
          grep -Fq 'profile.href = `/perfil/?u=' js/portal-chat.js
          grep -q 'portal-chat-avatar-image' js/portal-chat.js
          grep -q 'portalChatHeaderAvatar' js/portal-chat.js
          grep -q 'syncMessageDateDividers' js/portal-chat.js
          grep -q 'portal-chat-date-divider' css/portal-chat.css
          test -f css/portal-chat-profile-link.css
          grep -q "portal-chat-present" js/medical-portal-nav.js
          ! grep -q "ensureChatAssets" js/medical-portal-nav.js
      - name: Garantir chat global sem ampliar autorização
        run: |
          set -euo pipefail
          for file in \
            index.html ferramentas/index.html amigos/index.html notificacoes/index.html perfil/index.html \
            seguranca/index.html configuracoes/index.html conquistas/index.html estudos/index.html \
            medico/index.html protocolo/index.html recepcao/index.html telemedicina/index.html \
            documentos/index.html agenda/index.html agenda/sync/index.html cidadao/index.html \
            conselho/painel/index.html admin/usuarios/index.html admin/monitoramento/index.html \
            admin/configuracao/index.html admin/social/index.html; do
            grep -q "portal-global-chat.js?v=20261008-chat-groups-1" "$file"
            ! grep -q "portal-chat.js?v=" "$file"
            ! grep -q "portal-chat-switch-optimizer.js?v=" "$file"
          done
          ! grep -q "portal-global-chat.js" login/index.html
          ! grep -q "portal-global-chat.js" cadastro/index.html
          ! grep -q "portal-global-chat.js" conselho/index.html
          grep -q "CHAT_ROLES = new Set(\['medico', 'recepcao', 'coordenacao', 'telemedicina', 'admin', 'cidadao'\])" js/portal-chat.js
          grep -q "PROFESSIONAL_ROLES = new Set(\['medico', 'recepcao', 'coordenacao', 'telemedicina', 'admin'\])" worker/portal-chat-v2.js
          grep -q "socialFriendContacts" worker/portal-chat-v2.js
          grep -q "socialFriendAllowed" worker/portal-chat-v2.js
          grep -q "relationship.state = 'friends'" worker/portal-chat-v2.js
          grep -q "professionalContactAllowed" worker/portal-chat-v2.js
          grep -q "chatContactAllowed" worker/portal-chat-v2.js

  browser-chat-presentation:
    needs: validate-chat
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Preparar navegador isolado
        run: |
          npm install --prefix "$RUNNER_TEMP/chat-browser" --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.1
          node "$RUNNER_TEMP/chat-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Fotos, temas, datas e paginação com dados fictícios
        run: |
          NODE_PATH="$RUNNER_TEMP/chat-browser/node_modules" PORTAL_CHAT_EVIDENCE_DIR="$RUNNER_TEMP/chat-presentation-evidence" node worker/tests/browser/chat-presentation.cjs
      - name: Recebimento ao vivo e recuperação sem reabrir a conversa
        run: |
          NODE_PATH="$RUNNER_TEMP/chat-browser/node_modules" PORTAL_CHAT_EVIDENCE_DIR="$RUNNER_TEMP/chat-presentation-evidence" node worker/tests/browser/chat-live-reception.cjs
      - name: Grupos privados, permissões, reenvio e três participantes
        run: |
          NODE_PATH="$RUNNER_TEMP/chat-browser/node_modules" PORTAL_CHAT_EVIDENCE_DIR="$RUNNER_TEMP/chat-presentation-evidence" node worker/tests/browser/chat-groups.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chat-presentation-synthetic
          path: ${{ runner.temp }}/chat-presentation-evidence
          if-no-files-found: ignore
