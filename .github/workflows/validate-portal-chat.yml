name: Validar chat interno do portal

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-chat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar sintaxe
        run: |
          node --check worker/portal-chat.js
          node --check worker/index.js
          node --check js/portal-chat.js
          node --check js/medical-portal-nav.js
      - name: Conferir integração
        run: |
          test -f css/portal-chat.css
          grep -q "handleChatRoute" worker/index.js
          grep -q "portal_chat_messages" worker/portal-chat.js
          grep -q "portal_chat_presence" worker/portal-chat.js
          grep -q "/api/chat/users" worker/portal-chat.js
          grep -q "/api/chat/messages" worker/portal-chat.js
          grep -q "ONLINE_WINDOW_SECONDS" worker/portal-chat.js
          grep -q "portal-chat.js?v=20260812-1" home/index.html
          grep -q "portal-chat.js?v=20260812-1" recepcao/index.html
          grep -q "portal-chat.js?v=20260812-1" conta/index.html
          grep -q "portal-chat.js?v=20260812-1" admin/usuarios/index.html
          grep -q "portal-chat.css?v=20260812-1" home/index.html
          grep -q "portal-chat.css?v=20260812-1" recepcao/index.html
          grep -q "portal-chat.css?v=20260812-1" conta/index.html
          grep -q "portal-chat.css?v=20260812-1" admin/usuarios/index.html
          grep -q "ensureChatAssets" js/medical-portal-nav.js
          grep -q "medical-portal-nav.js?v=20260812-2" index.html
          ! grep -q "portal-chat.js" login/index.html
