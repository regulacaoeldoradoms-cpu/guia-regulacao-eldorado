name: Validar chat interno do portal

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-chat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar sintaxe
        run: |
          node --check worker/portal-chat-v2.js
          node --check worker/push-notifications.js
          node --check worker/index.js
          node --check js/portal-global-chat.js
          node --check js/portal-chat.js
          node --check js/portal-pwa.js
          node --check js/portal-chat-switch-optimizer.js
          node --check js/medical-portal-nav.js
          node --check portal-sw.js
          node --test worker/tests/global-chat.test.mjs
      - name: Conferir integração profissional
        run: |
          test -f css/portal-chat.css
          grep -q 'html\[data-portal-theme="dark"\] \.portal-chat-body' css/portal-chat.css
          grep -q 'html\[data-portal-theme="dark"\] \.portal-chat-contact:hover' css/portal-chat.css
          grep -q 'html\[data-portal-theme="dark"\] \.portal-chat-message.mine' css/portal-chat.css
          grep -q "CHAT_CSS = '/css/portal-chat.css?v=20261002-receipts-1'" js/portal-global-chat.js
          grep -q "CHAT_SCRIPT = '/js/portal-chat.js?v=20261002-receipts-1'" js/portal-global-chat.js
          grep -q "CHAT_OPTIMIZER = '/js/portal-chat-switch-optimizer.js?v=20260928-global-1'" js/portal-global-chat.js
          test -f portal-sw.js
          test -f js/portal-chat-switch-optimizer.js
          grep -q "portal-chat-v2.js" worker/index.js
          grep -q "PROFESSIONAL_ROLES = new Set(\['medico', 'recepcao', 'coordenacao', 'telemedicina', 'admin'\])" worker/portal-chat-v2.js
          grep -q "decorateTelemedicineUser" worker/portal-chat-v2.js
          grep -q "decorateTelemedicineUsers" worker/portal-chat-v2.js
          grep -q "validatePortalSession(request, env, \[\])" worker/portal-chat-v2.js
          grep -q "u.role IN ('medico','recepcao','coordenacao','admin')" worker/portal-chat-v2.js
          grep -q "/api/chat/presence" worker/portal-chat-v2.js
          grep -q "/api/chat/users" worker/portal-chat-v2.js
          grep -q "/api/chat/messages" worker/portal-chat-v2.js
          grep -q "/api/chat/delivery" worker/portal-chat-v2.js
          grep -q "delivered_at TEXT" worker/portal-chat-v2.js
          grep -q "peekOnly" worker/portal-chat-v2.js
          grep -q "beforeId" worker/portal-chat-v2.js
          grep -q "MESSAGE_HISTORY_PAGE_SIZE = 120" worker/portal-chat-v2.js
          grep -q "preloadConversationsInBackground" js/portal-chat.js
          grep -q "MESSAGE_PRELOAD_PAGE_GUARD = 100" js/portal-chat.js
          grep -q "messageCache = new Map" js/portal-chat.js
          grep -q "notifyUserPush" worker/portal-chat-v2.js
          grep -q "addEventListener('push'" portal-sw.js
          grep -q "/api/push/subscriptions" js/portal-pwa.js
          grep -q "Uso interno do portal" js/portal-chat.js
          grep -q "Notification.requestPermission" js/portal-chat.js
          grep -q "showNotification" js/portal-chat.js
          grep -q "serviceWorker.register('/portal-sw.js'" js/portal-chat.js
          grep -q "version: '20261002-receipts-1'" js/portal-chat.js
          grep -q "PortalChatSwitchOptimizer" js/portal-chat-switch-optimizer.js
          grep -q "CHAT_ROLES = new Set(\['medico', 'recepcao', 'coordenacao', 'telemedicina', 'admin', 'cidadao'\])" js/portal-chat.js
          grep -q "id=\"portalChatProfileLink\"" js/portal-chat.js
          grep -Fq 'profile.href = `/perfil/?u=' js/portal-chat.js
          grep -Fq "background-image:url('" js/portal-chat.js
          ! grep -Fq 'background-image:url("${photo' js/portal-chat.js
          test -f css/portal-chat-profile-link.css
          grep -q "portal-chat-present" js/medical-portal-nav.js
          ! grep -q "ensureChatAssets" js/medical-portal-nav.js
      - name: Garantir chat global sem ampliar autorização
        run: |
          set -euo pipefail
          for file in \
            index.html ferramentas/index.html amigos/index.html notificacoes/index.html perfil/index.html \
            seguranca/index.html configuracoes/index.html conquistas/index.html estudos/index.html \
            medico/index.html protocolo/index.html recepcao/index.html telemedicina/index.html \
            documentos/index.html agenda/index.html agenda/sync/index.html cidadao/index.html \
            conselho/painel/index.html admin/usuarios/index.html admin/monitoramento/index.html \
            admin/configuracao/index.html admin/social/index.html; do
            grep -q "portal-global-chat.js?v=20261002-receipts-1" "$file"
            ! grep -q "portal-chat.js?v=" "$file"
            ! grep -q "portal-chat-switch-optimizer.js?v=" "$file"
          done
          ! grep -q "portal-global-chat.js" login/index.html
          ! grep -q "portal-global-chat.js" cadastro/index.html
          ! grep -q "portal-global-chat.js" conselho/index.html
          grep -q "CHAT_ROLES = new Set(\['medico', 'recepcao', 'coordenacao', 'telemedicina', 'admin', 'cidadao'\])" js/portal-chat.js
          grep -q "PROFESSIONAL_ROLES = new Set(\['medico', 'recepcao', 'coordenacao', 'telemedicina', 'admin'\])" worker/portal-chat-v2.js
          grep -q "socialFriendContacts" worker/portal-chat-v2.js
          grep -q "socialFriendContact" worker/portal-chat-v2.js
          grep -q "relationship.state = 'friends'" worker/portal-chat-v2.js
          grep -q "const institutional = await professionalContact" worker/portal-chat-v2.js
          grep -q "return socialFriendContact(env, currentUser.username, targetUsername)" worker/portal-chat-v2.js
