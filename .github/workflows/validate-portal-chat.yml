name: Validar chat interno do portal

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-chat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar sintaxe
        run: |
          node --check worker/portal-chat-v2.js
          node --check worker/push-notifications.js
          node --check worker/index.js
          node --check js/portal-chat.js
          node --check js/portal-pwa.js
          node --check js/portal-chat-switch-optimizer.js
          node --check js/medical-portal-nav.js
          node --check portal-sw.js
      - name: Conferir integração profissional
        run: |
          test -f css/portal-chat.css
          test -f portal-sw.js
          test -f js/portal-chat-switch-optimizer.js
          grep -q "portal-chat-v2.js" worker/index.js
          grep -q "PROFESSIONAL_ROLES = new Set(\['medico', 'recepcao', 'coordenacao', 'telemedicina', 'admin'\])" worker/portal-chat-v2.js
          grep -q "decorateTelemedicineUser" worker/portal-chat-v2.js
          grep -q "decorateTelemedicineUsers" worker/portal-chat-v2.js
          grep -q "validatePortalSession(request, env, \[\])" worker/portal-chat-v2.js
          grep -q "u.role IN ('medico','recepcao','coordenacao','admin')" worker/portal-chat-v2.js
          grep -q "/api/chat/presence" worker/portal-chat-v2.js
          grep -q "/api/chat/users" worker/portal-chat-v2.js
          grep -q "/api/chat/messages" worker/portal-chat-v2.js
          grep -q "notifyUserPush" worker/portal-chat-v2.js
          grep -q "addEventListener('push'" portal-sw.js
          grep -q "/api/push/subscriptions" js/portal-pwa.js
          grep -q "Uso interno do portal" js/portal-chat.js
          grep -q "Notification.requestPermission" js/portal-chat.js
          grep -q "showNotification" js/portal-chat.js
          grep -q "serviceWorker.register('/portal-sw.js'" js/portal-chat.js
          grep -q "portal-chat.js?v=20260911-2" index.html
          grep -q "portal-chat.js?v=20260911-1" recepcao/index.html
          grep -q "portal-chat.js?v=20260911-1" admin/usuarios/index.html
          grep -q "CHAT_ROLES = new Set(\['medico', 'recepcao', 'coordenacao', 'telemedicina', 'admin', 'cidadao'\])" js/portal-chat.js
          grep -q "id=\"portalChatProfileLink\"" js/portal-chat.js
          grep -Fq 'profile.href = `/perfil/?u=' js/portal-chat.js
          grep -Fq "background-image:url('" js/portal-chat.js
          ! grep -Fq 'background-image:url("${photo' js/portal-chat.js
          test -f css/portal-chat-profile-link.css
          grep -q "portal-chat-switch-optimizer.js?v=20260812-1" index.html
          grep -q "portal-chat-switch-optimizer.js?v=20260812-1" recepcao/index.html
          grep -q "portal-chat-switch-optimizer.js?v=20260812-1" admin/usuarios/index.html
          grep -q "ensureChatAssets" js/medical-portal-nav.js
          grep -q "portal-chat-present" js/medical-portal-nav.js
      - name: Garantir separação entre chat profissional e chat social
        run: |
          set -euo pipefail
          ! grep -q "portal-chat.js" login/index.html
          ! grep -q "portal-chat.js" cadastro/index.html
          ! grep -q "portal-chat.js" cidadao/index.html
          ! grep -q "portal-chat.js" conselho/index.html
          ! grep -q "portal-chat.js" conselho/painel/index.html
          ! grep -q "portal-chat.js" conta/index.html
          ! grep -q "portal-chat.js" seguranca/index.html
          ! grep -q "portal-chat.js" configuracoes/index.html
          ! grep -q "portal-chat.js" conquistas/index.html
          grep -q "socialFriendContacts" worker/portal-chat-v2.js
          grep -q "socialFriendContact" worker/portal-chat-v2.js
          grep -q "relationship.state = 'friends'" worker/portal-chat-v2.js
          grep -q "const institutional = await professionalContact" worker/portal-chat-v2.js
          grep -q "return socialFriendContact(env, currentUser.username, targetUsername)" worker/portal-chat-v2.js
          ! grep -q "isSocialProfessional(viewer) === isSocialProfessional(target)" worker/social-policy.js
          ! grep -q "au.role = 'cidadao' AND au.accept_friend_requests = 1" worker/social.js
