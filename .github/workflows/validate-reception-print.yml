name: Validar impressão da recepção

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate-reception-print:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar sintaxe
        run: |
          node --check js/reception-app.js
          node --check js/reception-ux.js
          node --check js/reception-clinical-checklist.js
          node --check js/reception-print-v5.js
      - name: Conferir integração da impressão
        run: |
          test -f js/reception-print-v5.js
          grep -q 'reception-print-v5.js?v=20260812-2' recepcao/index.html
          ! grep -q 'referral-practice-data.js' recepcao/index.html
          ! grep -q 'referral-practice-update-' recepcao/index.html
          grep -q "COMPLETE_BUTTON_ID = 'printCompleteOrientation'" js/reception-print-v5.js
          grep -q "MISSING_BUTTON_ID = 'printMissingItems'" js/reception-print-v5.js
          grep -q 'Informações que precisam constar no encaminhamento' js/reception-print-v5.js
          grep -q 'Exames e documentos obrigatórios' js/reception-print-v5.js
          grep -q 'Obrigatórios somente quando se aplicarem ao caso' js/reception-print-v5.js
          grep -q 'Se já possuir / quando disponível' js/reception-print-v5.js
          ! grep -q 'Via de acesso' js/reception-print-v5.js
          ! grep -q 'Como esta solicitação deve ser feita' js/reception-print-v5.js
          ! grep -q 'fluxoLocal' js/reception-print-v5.js
          ! grep -q 'Pontos observados nas devoluções reais' js/reception-print-v5.js
          ! grep -q 'Devoluções observadas nesta área' js/reception-print-v5.js
          ! grep -q 'Experiência prática' js/reception-print-v5.js
          ! grep -q 'REFERRAL_PRACTICE_GUIDANCE' js/reception-print-v5.js
          grep -q 'printInPopup' js/reception-print-v5.js
          grep -q 'printInFrame' js/reception-print-v5.js
          grep -qi 'impressão não é obrigatória' js/reception-print-v5.js
          grep -q 'Ctrl+P' js/reception-print-v5.js
          grep -q 'Bairro Jardim das Grevílias' js/reception-print-v5.js
          grep -q '07:00 às 11:00' js/reception-print-v5.js
