name: Validar Telemedicina

on:
  pull_request:
    paths:
      - 'telemedicina/**'
      - 'css/telemedicina.css'
      - 'css/telemedicina-outcome-v14.css'
      - 'css/telemedicina-mobile-v15.css'
      - 'css/telemedicina-desktop-v16.css'
      - 'css/account-admin.css'
      - 'js/telemedicina.js'
      - 'js/telemedicina-business-day.js'
      - 'js/telemedicina-mobile-v7.js'
      - 'js/home.js'
      - 'js/admin-users.js'
      - 'js/account.js'
      - 'index.html'
      - 'conta/index.html'
      - 'admin/usuarios/index.html'
      - 'worker/telemedicine*.js'
      - 'worker/auth-management-flex.js'
      - 'worker/portal-safety.js'
      - 'worker/index.js'
      - 'worker/tests/telemedicine-rules.test.mjs'
      - 'docs/TELEMEDICINA.md'
      - 'docs/TELEMEDICINA-DESKTOP-V16.md'
      - 'PORTAL-ARQUITETURA.md'
      - '.github/workflows/validate-telemedicine.yml'
  push:
    branches: [main]
    paths:
      - 'telemedicina/**'
      - 'css/telemedicina.css'
      - 'css/telemedicina-outcome-v14.css'
      - 'css/telemedicina-mobile-v15.css'
      - 'css/telemedicina-desktop-v16.css'
      - 'css/account-admin.css'
      - 'js/telemedicina.js'
      - 'js/telemedicina-business-day.js'
      - 'js/telemedicina-mobile-v7.js'
      - 'js/home.js'
      - 'js/admin-users.js'
      - 'js/account.js'
      - 'index.html'
      - 'conta/index.html'
      - 'admin/usuarios/index.html'
      - 'worker/telemedicine*.js'
      - 'worker/auth-management-flex.js'
      - 'worker/portal-safety.js'
      - 'worker/index.js'
      - 'worker/tests/telemedicine-rules.test.mjs'
      - 'docs/TELEMEDICINA.md'
      - 'docs/TELEMEDICINA-DESKTOP-V16.md'
      - 'PORTAL-ARQUITETURA.md'
      - '.github/workflows/validate-telemedicine.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Conferir arquivos e sintaxe
        shell: bash
        run: |
          set -euo pipefail
          test -f telemedicina/index.html
          test -f css/telemedicina.css
          test -f css/telemedicina-outcome-v14.css
          test -f css/telemedicina-mobile-v15.css
          test -f css/telemedicina-desktop-v16.css
          test -f css/account-admin.css
          test -f js/telemedicina.js
          test -f js/telemedicina-business-day.js
          test -f js/telemedicina-mobile-v7.js
          test -f docs/TELEMEDICINA-DESKTOP-V16.md
          test -f worker/telemedicine.js
          test -f worker/telemedicine-access.js
          test -f worker/telemedicine-rules.js
          node --check js/telemedicina.js
          node --check js/telemedicina-business-day.js
          node --check js/telemedicina-mobile-v7.js
          node --check js/home.js
          node --check js/admin-users.js
          node --check js/account.js
          node --input-type=module --check < worker/telemedicine.js
          node --input-type=module --check < worker/telemedicine-access.js
          node --input-type=module --check < worker/telemedicine-rules.js
          node --input-type=module --check < worker/auth-management-flex.js
          node --input-type=module --check < worker/portal-safety.js
          node --input-type=module --check < worker/index.js
      - name: Testar regra dos retornos
        shell: bash
        run: |
          set -euo pipefail
          cp worker/telemedicine-rules.js /tmp/telemedicine-rules.mjs
          node worker/tests/telemedicine-rules.test.mjs /tmp/telemedicine-rules.mjs
      - name: Conferir autorização, interface, importação e privacidade
        shell: bash
        run: |
          set -euo pipefail
          grep -q "isTelemedicineApi" worker/index.js
          grep -q "Acesso exclusivo da Telemedicina ou do Desenvolvedor" worker/telemedicine.js
          grep -q "Somente o Desenvolvedor pode executar a migração inicial" worker/telemedicine.js
          grep -q "Somente o Desenvolvedor pode conceder o perfil Técnico em Telemedicina" worker/auth-management-flex.js
          grep -q "perfil Técnico em Telemedicina é gerenciado somente pelo Desenvolvedor" worker/auth-management-flex.js
          grep -q "'telemedicina'" worker/portal-safety.js
          grep -q "telemedicine_patients" worker/telemedicine.js
          grep -q "telemedicine_followups" worker/telemedicine.js
          grep -q "telemedicine_events" worker/telemedicine.js
          grep -q "const IMPORT_BATCH_LIMIT = 5;" worker/telemedicine.js
          grep -q "const batchSize = 5;" js/telemedicina.js
          grep -q "const existingEvent = await firestoreGet" worker/telemedicine.js
          grep -q "if (!existingEvent)" worker/telemedicine.js
          grep -q "telemedicina.js?v=20260903-3" telemedicina/index.html
          grep -q "telemedicina.css?v=20260903-1" telemedicina/index.html
          grep -q "telemedicine-title-mobile" telemedicina/index.html
          grep -q "Data da última consulta" telemedicina/index.html
          grep -q "Alta do episódio" telemedicina/index.html
          grep -q "Retorno com prazo ou data" telemedicina/index.html
          grep -q "Retorno após uma condição" telemedicina/index.html
          grep -q "consultConditionType" telemedicina/index.html
          grep -q "telemedicina-outcome-v14.css?v=20260903-1" telemedicina/index.html
          grep -q "telemedicina-mobile-v15.css?v=20260903-3" telemedicina/index.html
          grep -q "telemedicina-desktop-v16.css?v=20260903-2" telemedicina/index.html
          grep -q "telemedicina-mobile-v7.js?v=20260903-1" telemedicina/index.html
          grep -q 'data-desktop-design="v16"' telemedicina/index.html
          grep -q 'data-mobile-readability="v15"' telemedicina/index.html
          grep -q "min-height: 82px" css/telemedicina-mobile-v15.css
          grep -q "flex-flow: row nowrap !important" css/telemedicina-mobile-v15.css
          grep -q "font-size: 1.28rem !important" css/telemedicina-mobile-v15.css
          grep -q "font-size: .9rem !important" css/telemedicina-mobile-v15.css
          grep -q "min-height: 350px !important" css/telemedicina-mobile-v15.css
          grep -q "grid-template-columns: repeat(3, minmax(0, 1fr))" css/telemedicina-desktop-v16.css
          grep -q "tm-context-desktop" css/telemedicina-desktop-v16.css
          grep -q -- "--tm-desktop-action-height: 48px" css/telemedicina-desktop-v16.css
          grep -q "grid-template-columns: 1fr" css/telemedicina-desktop-v16.css
          grep -q "Programar.*Solicitado.*Histórico" docs/TELEMEDICINA-DESKTOP-V16.md
          grep -q "telemedicine-desktop-view-v16" js/telemedicina-mobile-v7.js
          grep -q "Grade 3×3" js/telemedicina-mobile-v7.js
          grep -q "consultFollowupFields" telemedicina/index.html
          grep -q "launchDischargeCelebration" js/telemedicina.js
          grep -q "telemedicine:celebrate-discharge" js/telemedicina.js
          grep -q "telemedicina-mobile-v9.js?v=20260903-2" telemedicina/index.html
          grep -q "prefers-reduced-motion:reduce" css/telemedicina.css
          grep -q "const requestedMode" worker/telemedicine.js
          grep -q "returnConditionResolution" worker/telemedicine.js
          grep -q "returnConditionResolution" worker/telemedicine-rules.js
          grep -q "followupMode" worker/telemedicine.js
          grep -q "ALTA DO EPISÓDIO" worker/telemedicine.js
          grep -q "Registro objetivo de alta" docs/TELEMEDICINA.md
          grep -q "Três condutas de retorno" docs/TELEMEDICINA.md
          grep -q "Mobile UX v2" css/telemedicina.css
          grep -q "@media(max-width:860px)" css/telemedicina.css
          grep -q "#openConsultation{position:fixed" css/telemedicina.css
          grep -q "Experiência mobile" docs/TELEMEDICINA.md
          grep -q "Experiência desktop V16" docs/TELEMEDICINA.md
          grep -q "três cartões por linha" docs/TELEMEDICINA-DESKTOP-V16.md
          grep -q "Não há limite de nove cartões" docs/TELEMEDICINA-DESKTOP-V16.md
          grep -q "camada V15" docs/TELEMEDICINA.md
          grep -q "textos operacionais secundários próximos de 14 px" docs/TELEMEDICINA.md
          grep -q "uma única linha horizontal" docs/TELEMEDICINA.md
          if grep -q "cabeçalho usa duas linhas" docs/TELEMEDICINA.md; then
            echo 'A documentação não pode reintroduzir o cabeçalho móvel em duas linhas.' >&2
            exit 1
          fi
          grep -q "href=\"/telemedicina/\"" js/home.js
          grep -q "Técnico em Telemedicina" js/admin-users.js
          grep -q "telemedicina: 'Técnico em Telemedicina'" js/account.js
          grep -q "Privacidade à escolha · conta Bronze" js/account.js
          grep -q "anônima</strong> e <strong>identificada" conta/index.html
          grep -q "admin-users.js?v=20260901-1" admin/usuarios/index.html
          grep -q "telemedicina-business-day.js" telemedicina/index.html
          grep -q "account-admin.css" telemedicina/index.html
          grep -q "modal-backdrop.open" css/account-admin.css
          grep -q "account-status.visible" css/account-admin.css
          if find . -iname '*migracao_privada*' -o -iname '*telemedicina*migracao*.json' | grep -q .; then
            echo 'Arquivo privado de migração não pode ser versionado.' >&2
            exit 1
          fi
          if grep -R -n -E '\b(CNS|CPF)\b' telemedicina js/telemedicina.js js/telemedicina-business-day.js worker/telemedicine.js worker/telemedicine-rules.js worker/telemedicine-access.js; then
            echo 'Identificador pessoal proibido no módulo versionado.' >&2
            exit 1
          fi
