name: Diagnosticar Camada Social em produção

on:
  pull_request:
    paths:
      - '.github/workflows/diagnose-social-production.yml'
      - 'js/social-api.js'
      - 'js/home.js'
      - 'worker/social.js'
      - 'worker/social-schema.js'
      - 'worker/wrangler.toml'
  workflow_dispatch:

jobs:
  probe-production:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar Worker sem credenciais
        shell: bash
        run: |
          set -euo pipefail
          base='https://yellow-wave-d0a1guia-regulacao-ia.regulacaoeldoradoms.workers.dev'
          origin='https://regulacaoeldoradoms.com.br'

          probe() {
            local label="$1"
            local path="$2"
            local method="${3:-GET}"
            local body_file
            body_file="$(mktemp)"
            local status
            status="$(curl --connect-timeout 10 --max-time 30 -sS -X "$method" \
              -H "Origin: $origin" \
              -o "$body_file" -w '%{http_code}' "$base$path")"
            echo "$label status=$status"
            tr '\n' ' ' < "$body_file" | head -c 600 || true
            echo
            rm -f "$body_file"
          }

          probe 'auth-me' '/api/auth/me'
          probe 'social-config' '/api/social/config'
          probe 'social-preflight' '/api/social/config' 'OPTIONS'
