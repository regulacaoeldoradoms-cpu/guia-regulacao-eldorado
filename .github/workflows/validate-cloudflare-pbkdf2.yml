name: Validar PBKDF2 Cloudflare

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-pbkdf2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar autenticação usada pelo Worker
        run: |
          node --check worker/auth-management-fixed.js
          node --check worker/index.js
          grep -q "auth-management-fixed.js" worker/index.js
          grep -q "const PBKDF2_ITERATIONS = 100000;" worker/auth-management-fixed.js
          if grep -E "PBKDF2_ITERATIONS = (1[0-9]{5,}|[2-9][0-9]{5,});" worker/auth-management-fixed.js; then
            echo 'PBKDF2 acima de 100000 não é compatível com Cloudflare Workers.'
            exit 1
          fi
