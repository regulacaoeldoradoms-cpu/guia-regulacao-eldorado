name: Validar PBKDF2 Cloudflare

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-pbkdf2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar autenticação usada pelo Worker
        run: |
          node --check worker/auth-management-v2.js
          node --check worker/auth-management-flex.js
          node --check worker/index.js
          grep -q "auth-management-flex.js" worker/index.js
          grep -q "PBKDF2_ITERATIONS = 100000" worker/auth-management-v2.js
