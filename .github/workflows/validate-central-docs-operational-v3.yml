name: Central de Documentos — Procedimento operacional V3

on:
  pull_request:
    paths:
      - 'scripts/central-docs/liberar-escrita-preview-4d-v3.mjs'
      - 'scripts/central-docs/liberar-escrita-preview-4d-v3.test.mjs'
      - '.github/workflows/validate-central-docs-operational-v3.yml'

permissions:
  contents: read

jobs:
  synthetic-procedure-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Conferir sintaxe
        run: node --check scripts/central-docs/liberar-escrita-preview-4d-v3.mjs
      - name: Testar protecoes e verificacao somente leitura com transporte simulado
        run: node --test scripts/central-docs/liberar-escrita-preview-4d-v3.test.mjs
