name: Validar abertura pós-login — navegador

on:
  pull_request:
    paths:
      - 'login/index.html'
      - 'js/login-opening.js'
      - 'js/login.js'
      - 'portal-sw.js'
      - 'index.html'
      - 'js/home.js'
      - 'assets/portal-opening-v1.mp4'
      - 'scripts/build-central-docs-staging.mjs'
      - 'scripts/verify-login-publication.mjs'
      - 'testing/post-login-opening/**'
      - 'testing/browser/post-login-opening.spec.mjs'
      - 'testing/browser/playwright-opening.config.mjs'
      - 'testing/browser/serve-staging.mjs'
      - 'worker/tests/post-login-opening.test.mjs'
      - '.github/workflows/validate-post-login-opening-browser.yml'
  push:
    branches: [main]
    paths:
      - 'login/index.html'
      - 'js/login-opening.js'
      - 'js/login.js'
      - 'portal-sw.js'
      - 'assets/portal-opening-v1.mp4'
      - 'scripts/verify-login-publication.mjs'
      - '.github/workflows/validate-post-login-opening-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright:
    name: Vídeo real em Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Playwright
        working-directory: testing/browser
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Conferir binário oficial e contratos de login
        run: node --test worker/tests/post-login-opening.test.mjs
      - name: Executar laboratório da abertura
        working-directory: testing/browser
        run: npx playwright test --config playwright-opening.config.mjs
      - name: Confirmar publicação estática em produção sem autenticar
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node scripts/verify-login-publication.mjs
      - name: Publicar diagnóstico em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: post-login-opening-playwright-diagnostics
          path: |
            testing/browser/test-results/
            testing/browser/playwright-opening-report/
          if-no-files-found: ignore
          retention-days: 7
