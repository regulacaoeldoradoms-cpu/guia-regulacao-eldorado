name: Validar Telemedicina Mobile V9

on:
  pull_request:
    paths:
      - 'telemedicina/index.html'
      - 'css/telemedicina-mobile-v9.css'
      - 'css/telemedicina-outcome-v14.css'
      - 'css/telemedicina-mobile-v15.css'
      - 'js/telemedicina-mobile-v9.js'
      - 'docs/TELEMEDICINA-MOBILE-V9.md'
      - '.github/workflows/validate-telemedicine-mobile-v9.yml'
  push:
    branches: [main]
    paths:
      - 'telemedicina/index.html'
      - 'css/telemedicina-mobile-v9.css'
      - 'css/telemedicina-outcome-v14.css'
      - 'css/telemedicina-mobile-v15.css'
      - 'js/telemedicina-mobile-v9.js'
      - 'docs/TELEMEDICINA-MOBILE-V9.md'
      - '.github/workflows/validate-telemedicine-mobile-v9.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Conferir V9 mobile sanfonada
        shell: bash
        run: |
          set -euo pipefail
          test -f css/telemedicina-mobile-v9.css
          test -f css/telemedicina-outcome-v14.css
          test -f css/telemedicina-mobile-v15.css
          test -f js/telemedicina-mobile-v9.js
          test -f docs/TELEMEDICINA-MOBILE-V9.md
          node --check js/telemedicina-mobile-v9.js
          grep -q 'telemedicina-mobile-v9.css?v=20260903-1' telemedicina/index.html
          grep -q 'telemedicina-mobile-v9.js?v=20260903-2' telemedicina/index.html
          grep -q 'telemedicina-mobile-v15.css?v=20260903-3' telemedicina/index.html
          grep -q 'data-mobile-readability="v15"' telemedicina/index.html
          grep -q 'data-mobile-interaction="v9"' telemedicina/index.html
          grep -q 'tm-inline-mobile-v9' css/telemedicina-mobile-v9.css
          grep -q 'tm-inline-open' css/telemedicina-mobile-v9.css
          grep -q 'grid-column: 1 / -1' css/telemedicina-mobile-v9.css
          grep -q 'stopImmediatePropagation' js/telemedicina-mobile-v9.js
          grep -q 'openScheduleInline' js/telemedicina-mobile-v9.js
          grep -q 'openRequestedInline' js/telemedicina-mobile-v9.js
          grep -q 'openHistoryInline' js/telemedicina-mobile-v9.js
          grep -q 'toggleConsultationInline' js/telemedicina-mobile-v9.js
          grep -q 'Salvando em segundo plano' js/telemedicina-mobile-v9.js
          grep -q 'Data da última consulta' js/telemedicina-mobile-v9.js
          grep -q 'Alta do episódio' js/telemedicina-mobile-v9.js
          grep -q 'Retorno com prazo ou data' js/telemedicina-mobile-v9.js
          grep -q 'Retorno após uma condição' js/telemedicina-mobile-v9.js
          grep -q 'name="followupMode"' js/telemedicina-mobile-v9.js
          grep -q 'value="discharge"' js/telemedicina-mobile-v9.js
          grep -q 'value="scheduled"' js/telemedicina-mobile-v9.js
          grep -q 'value="conditional"' js/telemedicina-mobile-v9.js
          grep -q 'conditionType' js/telemedicina-mobile-v9.js
          grep -q 'telemedicine-choice-grid' css/telemedicina-outcome-v14.css
          grep -q 'min-height: 82px' css/telemedicina-mobile-v15.css
          grep -q 'flex-flow: row nowrap !important' css/telemedicina-mobile-v15.css
          grep -q 'portal-account-area .portal-user-meta' css/telemedicina-mobile-v15.css
          grep -q 'display: block !important' css/telemedicina-mobile-v15.css
          grep -q 'tm-view-grid .telemedicine-patient button' css/telemedicina-mobile-v15.css
          grep -q 'font-size: 1.28rem !important' css/telemedicina-mobile-v15.css
          grep -q 'font-size: .9rem !important' css/telemedicina-mobile-v15.css
          grep -q 'min-height: 350px !important' css/telemedicina-mobile-v15.css
          grep -q 'telemedicine:celebrate-discharge' js/telemedicina-mobile-v9.js
          grep -q 'data-tm-scheduled-field' js/telemedicina-mobile-v9.js
          grep -q 'data-tm-conditional-field' js/telemedicina-mobile-v9.js
          grep -q 'data-tm-active-field' js/telemedicina-mobile-v9.js
          grep -q 'ALTA DO EPISÓDIO' js/telemedicina-mobile-v9.js
          if grep -qE 'Resolutividade / conduta|Necessita acompanhamento/retorno|>Data da consulta<' js/telemedicina-mobile-v9.js; then
            echo 'O formulário mobile reintroduziu campos anteriores ao registro objetivo de alta.' >&2
            exit 1
          fi
          grep -q 'não deve executar recarga global da lista' docs/TELEMEDICINA-MOBILE-V9.md
          grep -q 'Legibilidade móvel e cabeçalho V15' docs/TELEMEDICINA-MOBILE-V9.md
          grep -q 'escala tipográfica ampliada' docs/TELEMEDICINA-MOBILE-V9.md
          grep -q 'uma única linha horizontal' docs/TELEMEDICINA-MOBILE-V9.md
          if grep -q 'usa duas linhas' docs/TELEMEDICINA-MOBILE-V9.md; then
            echo 'O cabeçalho móvel V15 deve permanecer em uma única linha.' >&2
            exit 1
          fi
          if grep -q 'min-width: 861px' css/telemedicina-mobile-v9.css; then
            echo 'A V9 não pode introduzir regras desktop.' >&2
            exit 1
          fi
          if grep -R -n -E '\b(CNS|CPF)\b' css/telemedicina-mobile-v9.css js/telemedicina-mobile-v9.js docs/TELEMEDICINA-MOBILE-V9.md; then
            echo 'A V9 não deve introduzir identificadores pessoais.' >&2
            exit 1
          fi
