name: Validar Telemedicina Mobile V9

on:
  pull_request:
    paths:
      - 'telemedicina/index.html'
      - 'css/telemedicina-mobile-v9.css'
      - 'js/telemedicina-mobile-v9.js'
      - 'docs/TELEMEDICINA-MOBILE-V9.md'
      - '.github/workflows/validate-telemedicine-mobile-v9.yml'
  push:
    branches: [main]
    paths:
      - 'telemedicina/index.html'
      - 'css/telemedicina-mobile-v9.css'
      - 'js/telemedicina-mobile-v9.js'
      - 'docs/TELEMEDICINA-MOBILE-V9.md'
      - '.github/workflows/validate-telemedicine-mobile-v9.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Conferir V9 mobile sanfonada
        shell: bash
        run: |
          set -euo pipefail
          test -f css/telemedicina-mobile-v9.css
          test -f js/telemedicina-mobile-v9.js
          test -f docs/TELEMEDICINA-MOBILE-V9.md
          node --check js/telemedicina-mobile-v9.js
          grep -q 'telemedicina-mobile-v9.css?v=20260902-1' telemedicina/index.html
          grep -q 'telemedicina-mobile-v9.js?v=20260902-1' telemedicina/index.html
          grep -q 'data-mobile-interaction="v9"' telemedicina/index.html
          grep -q 'tm-inline-mobile-v9' css/telemedicina-mobile-v9.css
          grep -q 'tm-inline-open' css/telemedicina-mobile-v9.css
          grep -q 'grid-column: 1 / -1' css/telemedicina-mobile-v9.css
          grep -q 'stopImmediatePropagation' js/telemedicina-mobile-v9.js
          grep -q 'openScheduleInline' js/telemedicina-mobile-v9.js
          grep -q 'openRequestedInline' js/telemedicina-mobile-v9.js
          grep -q 'openHistoryInline' js/telemedicina-mobile-v9.js
          grep -q 'toggleConsultationInline' js/telemedicina-mobile-v9.js
          grep -q 'Salvando em segundo plano' js/telemedicina-mobile-v9.js
          grep -q 'não deve executar recarga global da lista' docs/TELEMEDICINA-MOBILE-V9.md
          if grep -q 'min-width: 861px' css/telemedicina-mobile-v9.css; then
            echo 'A V9 não pode introduzir regras desktop.' >&2
            exit 1
          fi
          if grep -R -n -E '\b(CNS|CPF)\b' css/telemedicina-mobile-v9.css js/telemedicina-mobile-v9.js docs/TELEMEDICINA-MOBILE-V9.md; then
            echo 'A V9 não deve introduzir identificadores pessoais.' >&2
            exit 1
          fi
