name: Conciliar grupos com entrega concorrente da main
on:
  push:
    branches: [feat/chat-groups-reviewed-20261008]
    paths: [.github/workflows/reconcile-groups-main.yml]
permissions:
  contents: write
jobs:
  reconcile:
    if: github.ref == 'refs/heads/feat/chat-groups-reviewed-20261008'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Preservar as duas entregas com resolução estritamente delimitada
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 'a0a161788f694bc7d497c1e938311a97ec16d02f'
          git fetch origin main
          test "$(git rev-parse origin/main)" = '8e1a208bb924606a85aa4ada2397a81ae80011b5'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-commit --no-ff origin/main || {
            test "$(git diff --name-only --diff-filter=U)" = 'estudos/index.html'
            git show origin/main:estudos/index.html > estudos/index.html
            node - <<'NODE'
          const fs = require('node:fs');
          const path = 'estudos/index.html';
          const text = fs.readFileSync(path, 'utf8');
          const old = 'portal-global-chat.js?v=20261007-chat-live-recovery-1';
          if (text.split(old).length !== 2) throw Error('Referência de chat inesperada');
          fs.writeFileSync(path, text.replace(old, 'portal-global-chat.js?v=20261008-chat-groups-1'));
          NODE
            git add estudos/index.html
          }
          test -z "$(git diff --name-only --diff-filter=U)"
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          git diff --cached --check
          node --check js/portal-chat.js
          node --check js/portal-chat-groups.js
          node --check worker/chat-groups.js
          npm --prefix worker run check
          npm --prefix worker test
          git commit -m 'merge(main): preservar Missão Bancária e grupos privados do chat'
          test "$(git ls-remote origin refs/heads/feat/chat-groups-reviewed-20261008 | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/feat/chat-groups-reviewed-20261008
