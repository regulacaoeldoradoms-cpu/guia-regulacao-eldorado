name: Validar site

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Validar sintaxe JavaScript
        run: |
          node --check js/app.js
          node --check js/referral-practice-data.js
          node --check js/referral-practice-update-20260804.js
          node --check js/referral-practice-update-20260804-2.js
          node --check js/referral-practice-update-20260804-3.js
          node --check js/medical-app.js
          node --check js/dermatology-status.js
          node --check js/learning-mode.js
          node --check js/referral-workbench.js
          node --check js/institutional-print.js
          node --check js/ai-config.js
          node --check js/ai-assistant.js
          node --check js/ai-markdown.js
          node --check js/ai-gemini-theme.js
          node --check js/auth-config.js
          node --check js/auth-client.js
          node --check js/access-control.js
          node --check js/auth-fetch-bridge.js
          node --check js/login.js
          node --check js/home.js
          node --check js/medical-portal-nav.js
          node --check js/reception-app.js
          node --check worker/gemini-assistant.js

      - name: Conferir arquivos referenciados
        run: |
          test -f index.html
          test -f medico/index.html
          test -f login/index.html
          test -f home/index.html
          test -f recepcao/index.html
          test -f css/site.css
          test -f css/medical.css
          test -f css/referral-workbench.css
          test -f css/learning-mode.css
          test -f css/institutional-print.css
          test -f css/ai-assistant.css
          test -f css/ai-gemini-theme.css
          test -f css/portal.css
          test -f css/reception.css
          test -f js/referral-practice-data.js
          test -f js/referral-practice-update-20260804.js
          test -f js/referral-practice-update-20260804-2.js
          test -f js/referral-practice-update-20260804-3.js
          test -f js/medical-app.js
          test -f js/dermatology-status.js
          test -f js/learning-mode.js
          test -f js/referral-workbench.js
          test -f js/institutional-print.js
          test -f js/ai-config.js
          test -f js/ai-assistant.js
          test -f js/ai-markdown.js
          test -f js/ai-gemini-theme.js
          test -f js/auth-config.js
          test -f js/auth-client.js
          test -f js/access-control.js
          test -f js/auth-fetch-bridge.js
          test -f js/login.js
          test -f js/home.js
          test -f js/medical-portal-nav.js
          test -f js/reception-app.js
          test -f docs/METODOLOGIA-CAMADA-PRATICA.md
          test -f worker/gemini-assistant.js
          test -f worker/wrangler.toml
          test -f worker/package.json
          test -f CONFIGURAR-ASSISTENTE-GEMINI.md
          test -f protocolo/index.html
          grep -q 'css/medical.css' medico/index.html
          grep -q 'css/referral-workbench.css' medico/index.html
          grep -q 'css/learning-mode.css' medico/index.html
          grep -q 'css/ai-assistant.css' medico/index.html
          grep -q 'css/ai-gemini-theme.css' medico/index.html
          grep -q 'js/referral-practice-data.js' medico/index.html
          grep -q 'js/referral-practice-update-20260804.js' medico/index.html
          grep -q 'js/referral-practice-update-20260804-2.js' medico/index.html
          grep -q 'js/referral-practice-update-20260804-3.js' medico/index.html
          grep -q 'js/medical-app.js' medico/index.html
          grep -q 'js/dermatology-status.js' medico/index.html
          grep -q 'js/learning-mode.js' medico/index.html
          grep -q 'js/referral-workbench.js' medico/index.html
          grep -q 'js/auth-config.js' medico/index.html
          grep -q 'js/auth-client.js' medico/index.html
          grep -q 'js/access-control.js' medico/index.html
          grep -q 'js/auth-fetch-bridge.js' medico/index.html
          grep -q 'js/ai-config.js' medico/index.html
          grep -q 'js/ai-assistant.js' medico/index.html
          grep -q 'js/ai-markdown.js' medico/index.html
          grep -q 'js/ai-gemini-theme.js' medico/index.html
          grep -q 'js/medical-portal-nav.js' medico/index.html

      - name: Conferir portal, rotas e separação por perfil
        run: |
          grep -q 'HUB de trabalho' index.html
          grep -q 'Portal da Regulação de Saúde' index.html
          grep -q 'data-role-view="medico"' medico/index.html
          grep -q 'data-required-role="medico"' medico/index.html
          grep -q 'Área destinada ao perfil médico' medico/index.html
          grep -q 'href="/protocolo/"' medico/index.html
          grep -q 'Portal da Regulação de Saúde' login/index.html
          grep -q 'location.replace(target)' home/index.html
          grep -q 'rel="canonical" href="/"' home/index.html
          if grep -q 'HUB de trabalho' home/index.html; then
            echo 'A rota /home deve ser apenas um redirecionamento de compatibilidade.'
            exit 1
          fi
          grep -q 'Conferência da Recepção' recepcao/index.html
          grep -q 'documentos, laudos, imagens e exames' recepcao/index.html
          grep -q "homePath: '/'" js/auth-config.js
          grep -q 'href="/medico/"' js/home.js
          grep -q "link.href = '/'" js/medical-portal-nav.js
          grep -q "location.replace('/login/')" js/account.js
          grep -q "normalized === '/medico/'" worker/usage-monitor.js
          grep -q '"start_url": "/medico/"' site.webmanifest
          grep -q 'href="/medico/"' protocolo/index.html
          grep -q "enforcement: false" js/auth-config.js
          grep -q "requireRole(\['recepcao', 'admin'\])" js/reception-app.js
          grep -q "requireRole(\['medico', 'recepcao', 'admin'\])" js/home.js
          grep -q 'documentaryPattern' js/reception-app.js
          grep -q 'conditionalPattern' js/reception-app.js
          grep -q 'Limite da recepção' js/reception-app.js
          grep -q 'Imprimir orientação do que falta' js/reception-app.js
          grep -q 'printMissing' js/reception-app.js
          grep -q "dataset?.roleView === 'medico'" js/learning-mode.js
          if grep -q 'js/institutional-print.js' medico/index.html; then
            echo 'A impressão institucional antiga não deve ficar carregada na área médica.'
            exit 1
          fi

      - name: Conferir autenticação no Worker sem segredos expostos
        run: |
          grep -q "AUTH_ROLES = new Set(\['medico', 'recepcao', 'coordenacao', 'admin'\])" worker/gemini-assistant.js
          grep -q '/api/auth/login' worker/gemini-assistant.js
          grep -q '/api/auth/me' worker/gemini-assistant.js
          grep -q '/api/auth/logout' worker/gemini-assistant.js
          grep -q 'AUTH_SESSION_SECRET' worker/gemini-assistant.js
          grep -q 'AUTH_USERS_JSON' worker/gemini-assistant.js
          grep -q 'AUTH_ENFORCE_AI' worker/gemini-assistant.js
          grep -q 'Authorization' worker/gemini-assistant.js
          grep -q 'SESSION_TTL_SECONDS' worker/gemini-assistant.js
          grep -q 'SENHA_FORTE' worker/wrangler.toml
          if grep -R -E 'AIza[0-9A-Za-z_-]{20,}' js worker index.html medico login home recepcao; then
            echo 'Possível chave da API exposta no repositório.'
            exit 1
          fi

      - name: Conferir separação entre protocolo e prática
        run: |
          grep -q 'REFERRAL_PRACTICE_GUIDANCE' js/referral-practice-data.js
          grep -q 'Síntese qualitativa e anonimizada' js/referral-practice-data.js
          grep -q 'Estas estruturas alimentam o Gemini' js/referral-workbench.js
          grep -q 'Protocolo oficial' js/referral-workbench.js
          grep -q 'Converse com o Gemini sobre devoluções reais' js/referral-workbench.js
          grep -q 'A experiência regulatória fica na IA' js/referral-workbench.js
          grep -q 'Nenhum item prático é classificado como requisito oficial' js/referral-workbench.js
          grep -q 'official-protocol-heading' css/referral-workbench.css
          grep -q 'official-protocol-nav' css/referral-workbench.css
          grep -q 'practical-ai-card' css/referral-workbench.css
          grep -q 'Veja o protocolo. Converse com o Gemini como em uma pré-regulação.' medico/index.html
          grep -q 'Uma exigência isolada não é transformada automaticamente em regra universal' docs/METODOLOGIA-CAMADA-PRATICA.md
          if grep -q 'collapseOfficialContent' js/referral-workbench.js; then
            echo 'O protocolo oficial não pode ser recolhido pela camada prática.'
            exit 1
          fi

      - name: Conferir primeiro estudo complementar de devoluções
        run: |
          grep -q "guidance.version = '1.1'" js/referral-practice-update-20260804.js
          grep -q "guidance.updatedAt = '04/08/2026'" js/referral-practice-update-20260804.js
          grep -q '13 documentos analisados em 04/08/2026' js/referral-practice-update-20260804.js
          grep -q 'Resultado descrito apenas como' js/referral-practice-update-20260804.js
          grep -q 'classificação clínica CEAP' js/referral-practice-update-20260804.js
          grep -q 'revisão pós-operatória' js/referral-practice-update-20260804.js
          if grep -E -i 'MURILO|ALANA|ANTONIO TORCATTI|LUCIANA PINTO|MARCIO ANTONIO|MAURI ANTONIO|ORACELIA|OROZINA|PAULO FERREIRA|ROBERTO NEVES|ROSIMEIRE|SANTA RAMONA|WILSON JOSE|CNS:|CPF:|telefone' js/referral-practice-update-20260804.js; then
            echo 'O primeiro complemento prático contém possível dado identificável.'
            exit 1
          fi

      - name: Conferir segundo estudo complementar de devoluções
        run: |
          grep -q "guidance.version = '1.2'" js/referral-practice-update-20260804-2.js
          grep -q '20 documentos analisados em 04/08/2026' js/referral-practice-update-20260804-2.js
          grep -q 'consulta diagnóstica, seguimento clínico, revisão pós-operatória, procedimento ou cirurgia' js/referral-practice-update-20260804-2.js
          grep -q 'sedação hospitalar' js/referral-practice-update-20260804-2.js
          grep -q 'exames hepáticos' js/referral-practice-update-20260804-2.js
          grep -q 'exame físico das mamas' js/referral-practice-update-20260804-2.js
          grep -q 'beta-hCG' js/referral-practice-update-20260804-2.js
          grep -q 'idade cadastral' js/referral-practice-update-20260804-2.js
          grep -q 'estrutura anatômica' js/referral-practice-update-20260804-2.js
          grep -q 'exame do estado mental' js/referral-practice-update-20260804-2.js
          grep -q 'não presumir que a prioridade original será mantida' js/referral-practice-update-20260804-2.js
          if grep -E -i 'AGATHA|AGUINALDO|TORCATTI|BRAYAN|BRUNO DOS SANTOS|CLAUDIA DE SOUZA|CLAUDINA|CORINA|DAIANE|DANIELI|DANIELLI|DEIZE|ELIZEU|GENILDA|GISLAINE|IRACEMA|MARTA BENITES|CNS:|CPF:|telefone' js/referral-practice-update-20260804-2.js; then
            echo 'O segundo complemento prático contém possível dado identificável.'
            exit 1
          fi

      - name: Conferir terceiro estudo complementar de devoluções
        run: |
          grep -q "guidance.version = '1.3'" js/referral-practice-update-20260804-3.js
          grep -q '17 documentos analisados em 04/08/2026' js/referral-practice-update-20260804-3.js
          grep -q 'se houver' js/referral-practice-update-20260804-3.js
          grep -q 'se possível' js/referral-practice-update-20260804-3.js
          grep -q 'especialidade escolhida' js/referral-practice-update-20260804-3.js
          grep -q 'estratégia farmacológica' js/referral-practice-update-20260804-3.js
          grep -q 'teste de Snellen' js/referral-practice-update-20260804-3.js
          grep -q 'ultrassonografia foi solicitada' js/referral-practice-update-20260804-3.js
          grep -q 'Fonoaudiologia/eMulti' js/referral-practice-update-20260804-3.js
          grep -q 'não recomendar cancelamento e nova inserção' js/referral-practice-update-20260804-3.js
          if grep -E -i 'DAENZILLI|DANIEL FIRMINO|EVELLEN|GERONIMO|GIVALDO|JUSSARA|MAIARA|MARCIA RODRIGUES|MARLENE|MILENI|NEIDE|RAQUEL|TERESINHA|VERONICA|WANDERLEY|ZENAIDE|CNS:|CPF:|telefone' js/referral-practice-update-20260804-3.js; then
            echo 'O terceiro complemento prático contém possível dado identificável.'
            exit 1
          fi

      - name: Conferir assistente dos protocolos
        run: |
          grep -q 'Pré-regulação com Gemini' js/ai-assistant.js
          grep -q 'Consulta local' js/ai-assistant.js
          grep -q 'Gemini · modo pré-regulação' js/ai-assistant.js
          grep -q 'Use casos anonimizados' js/ai-assistant.js
          grep -q 'MODO DE PRÉ-REGULAÇÃO CONVERSACIONAL' js/ai-assistant.js
          grep -q 'praticaRegulatoria: practicalContext' js/ai-assistant.js
          grep -q 'appendInlineFormatting' js/ai-markdown.js
          grep -q 'textContent = match' js/ai-markdown.js
          grep -q 'Assistente com base nos protocolos' js/ai-gemini-theme.js
          grep -q 'createGeminiLogo' js/ai-gemini-theme.js
          grep -q 'ai-protocol-seal' css/ai-gemini-theme.css
          grep -q 'Fonte consultada:' worker/gemini-assistant.js
          grep -q 'GEMINI_API_KEY' worker/gemini-assistant.js
          grep -q 'ALLOWED_ORIGINS' worker/wrangler.toml

      - name: Conferir disponibilidade da Dermatologia
        run: |
          grep -q "digsusStatus: 'indisponivel_local'" js/dermatology-status.js
          grep -q 'Teleconsulta de Dermatologia indisponível no momento' js/dermatology-status.js
          grep -q 'SISREG/CORE' js/dermatology-status.js

      - name: Conferir modo de aprendizagem
        run: |
          grep -q 'Conferência durante o preenchimento' js/learning-mode.js
          grep -q 'observer.disconnect()' js/learning-mode.js
          grep -q 'observer.observe(detailPanel' js/learning-mode.js
          grep -q 'printButton?.remove()' js/learning-mode.js

      - name: Conferir documento institucional legado
        run: |
          grep -q 'ORIENTAÇÃO PARA COMPLEMENTAÇÃO DE SOLICITAÇÃO' js/institutional-print.js
          grep -q 'logo-agenda.png' js/institutional-print.js
          grep -q 'Setor de Regulação de Saúde' js/institutional-print.js
          grep -q 'Fonte protocolar:' js/institutional-print.js
          grep -q 'institutional-document' css/institutional-print.css
          if grep -q 'Pontos que frequentemente impedem a análise regulatória' js/institutional-print.js; then
            echo 'A impressão institucional deve conter somente requisitos protocolares.'
            exit 1
          fi

      - name: Impedir emojis decorativos na interface principal
        run: |
          if grep -P '[\x{1F300}-\x{1FAFF}]' index.html medico/index.html login/index.html home/index.html recepcao/index.html css/medical.css css/referral-workbench.css css/learning-mode.css css/institutional-print.css css/ai-assistant.css css/ai-gemini-theme.css css/portal.css css/reception.css js/referral-practice-data.js js/referral-practice-update-20260804.js js/referral-practice-update-20260804-2.js js/referral-practice-update-20260804-3.js js/medical-app.js js/dermatology-status.js js/learning-mode.js js/referral-workbench.js js/institutional-print.js js/ai-config.js js/ai-markdown.js js/ai-gemini-theme.js js/auth-config.js js/auth-client.js js/access-control.js js/auth-fetch-bridge.js js/login.js js/home.js js/medical-portal-nav.js js/reception-app.js worker/gemini-assistant.js; then
            echo 'Foram encontrados emojis decorativos nos arquivos da interface médica/portal.'
            exit 1
          fi
          if grep -P '[\x{1F300}-\x{1FAFF}]' js/ai-assistant.js | grep -v -E '🟢|🟡|🟠|🔴'; then
            echo 'O assistente contém emoji fora dos quatro marcadores semânticos permitidos para o parecer simulado.'
            exit 1
          fi
