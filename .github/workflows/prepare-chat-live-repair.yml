name: Preparar correção isolada do recebimento do chat
on:
  push:
    branches: [fix/chat-live-recovery-20261007]
permissions:
  contents: write
jobs:
  prepare:
    if: github.ref == 'refs/heads/fix/chat-live-recovery-20261007'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Aplicar apenas ao snapshot revisado, validar e devolver à branch isolada
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'fix/chat-live-recovery-20261007'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = '146fabd41a8e5112017d6a43b83bc681ce48f821'
          PORTAL_CHAT_REPO="$PWD" node .github/apply-chat-live-fix.cjs
          node --check js/portal-chat.js
          node --check js/portal-global-chat.js
          node --check portal-sw.js
          node --check worker/tests/browser/chat-live-reception.cjs
          npm --prefix worker run check
          npm --prefix worker test
          git rm -- .github/apply-chat-live-fix.cjs .github/workflows/prepare-chat-live-repair.yml
          git add --all
          git diff --cached --check
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(chat): reconciliar recebimento sem reabrir a conversa'
          test "$(git ls-remote origin refs/heads/fix/chat-live-recovery-20261007 | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/fix/chat-live-recovery-20261007
