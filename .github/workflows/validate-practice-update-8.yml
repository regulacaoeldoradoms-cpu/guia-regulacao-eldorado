name: Validar orientações condicionais da Recepção

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-substance-use-operational-rule:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Validar sintaxe dos arquivos alterados
        run: |
          node --check js/referral-practice-update-20260908.js
          node --check js/reception-substance-guidance.js

      - name: Executar testes das orientações condicionais
        run: node --test worker/tests/substance-use-operational-rule.test.mjs

      - name: Conferir carregamento e cache
        run: |
          grep -q 'referral-practice-update-20260908.js?v=20260908-2' medico/index.html
          grep -q 'reception.css?v=20260908-1' recepcao/index.html
          grep -q 'reception-substance-guidance.js?v=20260908-5' recepcao/index.html

      - name: Conferir matriz condicional e regra de substâncias
        run: |
          grep -q "guidance.version = '1.9'" js/referral-practice-update-20260908.js
          grep -q 'Psiquiatria via DigSaúde MS aceita pacientes em uso de álcool ou outras drogas desde que estejam clinicamente estáveis' js/referral-practice-update-20260908.js
          grep -q 'Psicologia via DigSaúde MS não deve ser solicitada' js/referral-practice-update-20260908.js
          grep -q 'ORIENTAÇÃO CONDICIONAL — FLUXO DIGSAÚDE MS' js/reception-substance-guidance.js
          grep -q 'A recepção não avalia estabilidade' js/reception-substance-guidance.js
          grep -q 'Imprimir orientação condicional' js/reception-substance-guidance.js
          grep -q 'LDL ≥ 190 mg/dL' js/reception-substance-guidance.js
          grep -q 'convulsão febril simples' js/reception-substance-guidance.js
          grep -q 'cerume obstrutivo' js/reception-substance-guidance.js
          grep -q 'cardiopatas, nefropatas' js/reception-substance-guidance.js
          grep -q 'reception-conditional-print' js/reception-substance-guidance.js css/reception.css
          grep -q '#c62828' css/reception.css
          grep -q '08/09/2026 — Psicologia e Psiquiatria / álcool e outras drogas — CORRIGIDO' docs/METODOLOGIA-CAMADA-PRATICA.md
          grep -q '08/09/2026 — Matriz de orientações condicionais da Recepção' docs/METODOLOGIA-CAMADA-PRATICA.md

      - name: Impedir regressão para regras clínicas não suportadas
        run: |
          if grep -E 'teleconsultas de Psicologia e Psiquiatria não recebem pacientes|Psicologia e Psiquiatria</strong> não recebe' js/referral-practice-update-20260908.js js/reception-substance-guidance.js docs/METODOLOGIA-CAMADA-PRATICA.md; then
            echo 'Foi reintroduzida a generalização incorreta de que Psiquiatria não aceita pacientes em uso de substâncias.'
            exit 1
          fi
          if grep -E "aliases: \[[^]]*'dermatologia geral'|aliases: \[[^]]*'enfermagem em cuidados paliativos'|aliases: \[[^]]*'odontologia - estomatologia'" js/reception-substance-guidance.js; then
            echo 'Foi criado botão condicional para especialidade sem restrição objetiva identificada no estudo.'
            exit 1
          fi

      - name: Conferir anonimização
        run: |
          if grep -E -i 'Nome do Paciente|Nome da Mãe|CNS:|CPF:|Telefone\(s\)|Código da Solicitação' js/referral-practice-update-20260908.js js/reception-substance-guidance.js; then
            echo 'A atualização contém possível dado identificável.'
            exit 1
          fi
          if grep -E '[0-9]{11,15}' js/referral-practice-update-20260908.js js/reception-substance-guidance.js; then
            echo 'A atualização contém possível identificador numérico.'
            exit 1
          fi
