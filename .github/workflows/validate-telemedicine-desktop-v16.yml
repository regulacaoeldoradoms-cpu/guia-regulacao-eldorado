name: Validar Telemedicina Desktop V16

on:
  pull_request:
    paths:
      - 'telemedicina/index.html'
      - 'css/telemedicina-desktop-v16.css'
      - 'js/telemedicina-mobile-v7.js'
      - 'docs/TELEMEDICINA.md'
      - 'docs/TELEMEDICINA-DESKTOP-V16.md'
      - '.github/workflows/validate-telemedicine-desktop-v16.yml'
  push:
    branches: [main]
    paths:
      - 'telemedicina/index.html'
      - 'css/telemedicina-desktop-v16.css'
      - 'js/telemedicina-mobile-v7.js'
      - 'docs/TELEMEDICINA.md'
      - 'docs/TELEMEDICINA-DESKTOP-V16.md'
      - '.github/workflows/validate-telemedicine-desktop-v16.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Conferir camada desktop V16
        shell: bash
        run: |
          set -euo pipefail
          test -f css/telemedicina-desktop-v16.css
          test -f js/telemedicina-mobile-v7.js
          test -f docs/TELEMEDICINA-DESKTOP-V16.md
          node --check js/telemedicina-mobile-v7.js
          grep -q 'telemedicina-desktop-v16.css?v=20260903-2' telemedicina/index.html
          grep -q 'telemedicina-mobile-v7.js?v=20260903-1' telemedicina/index.html
          grep -q 'data-desktop-design="v16"' telemedicina/index.html
          grep -q '@media (min-width: 861px)' css/telemedicina-desktop-v16.css
          grep -q 'tm-context-desktop' css/telemedicina-desktop-v16.css
          grep -q 'tm-view-list' css/telemedicina-desktop-v16.css
          grep -q 'tm-view-grid' css/telemedicina-desktop-v16.css
          grep -q 'grid-template-columns: repeat(3, minmax(0, 1fr))' css/telemedicina-desktop-v16.css
          grep -q 'telemedicine-status.atrasado' css/telemedicina-desktop-v16.css
          grep -q 'telemedicine-status.em-aguardo' css/telemedicina-desktop-v16.css
          grep -q 'prefers-reduced-motion' css/telemedicina-desktop-v16.css
          grep -q -- '--tm-desktop-action-height: 48px' css/telemedicina-desktop-v16.css
          grep -q 'grid-template-columns: 1fr' css/telemedicina-desktop-v16.css
          grep -q 'telemedicine-desktop-view-v16' js/telemedicina-mobile-v7.js
          grep -q 'Grade 2×2' js/telemedicina-mobile-v7.js
          grep -q 'Grade 3×3' js/telemedicina-mobile-v7.js
          grep -q 'três cartões por linha' docs/TELEMEDICINA-DESKTOP-V16.md
          grep -q 'Não há limite de nove cartões' docs/TELEMEDICINA-DESKTOP-V16.md
          if grep -q 'max-width: 860px' css/telemedicina-desktop-v16.css; then
            echo 'A camada desktop não pode introduzir regras mobile.' >&2
            exit 1
          fi
          if grep -R -n -E '\b(CNS|CPF)\b' css/telemedicina-desktop-v16.css js/telemedicina-mobile-v7.js docs/TELEMEDICINA-DESKTOP-V16.md; then
            echo 'A camada visual não deve introduzir identificadores pessoais.' >&2
            exit 1
          fi
