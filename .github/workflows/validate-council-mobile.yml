name: Council mobile presentation
on:
  pull_request:
    paths:
      - 'conselho/painel/**'
      - 'css/council*.css'
      - 'js/council*.js'
      - 'js/auth-client.js'
      - 'testing/council/**'
      - 'worker/council*.js'
      - 'worker/tests/council-detail-prefetch.test.mjs'
      - '.github/workflows/validate-council-mobile.yml'
  push:
    branches: [main]
    paths:
      - 'conselho/painel/**'
      - 'css/council*.css'
      - 'js/council*.js'
      - 'testing/council/**'
      - 'worker/council*.js'
      - 'worker/tests/council-detail-prefetch.test.mjs'
      - '.github/workflows/validate-council-mobile.yml'
permissions:
  contents: read
jobs:
  synthetic-council-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-package-lock --no-audit --no-fund
        working-directory: testing/browser
      - run: npx playwright install --with-deps chromium
        working-directory: testing/browser
      - name: Select installed Chromium
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {chromium} from './testing/browser/node_modules/playwright/index.mjs';
          fs.appendFileSync(process.env.GITHUB_ENV, 'CHROMIUM_PATH=' + chromium.executablePath() + '\n');
          JS
      - name: Mobile frames, filters, native actions and read-only roles
        run: node testing/council/mobile-list.mjs
      - name: Institutional cursor, bounded pages and fresh authorization
        run: node --test worker/tests/council-pagination.test.mjs worker/tests/council-policy.test.mjs worker/tests/council-vice-access.test.mjs
      - name: Full list, detail, draft, action and return with 253 synthetic records
        run: node testing/council/visual-review.mjs /tmp/council-visual-review
      - name: Empty and short lists, text200, member and developer
        run: node testing/council/visual-extras.mjs /tmp/council-visual-extras
      - name: Selection across pages and out-of-order responses
        run: node testing/council/visual-state.mjs /tmp/council-visual-state
      - name: Detail snapshots, bounds, current authorization and side effects
        run: node --test testing/council/detail-cache.test.mjs worker/tests/council-detail-prefetch.test.mjs
      - name: Detail phone reading, drafts and rapid case changes
        run: node testing/council/detail-review.mjs /tmp/council-detail-review
      - name: Detail keyboard, text200, errors, sessions and member access
        run: node testing/council/detail-validation.mjs /tmp/council-detail-validation
      - name: Detail lifecycle and optional cache asset failure
        run: node testing/council/detail-lifecycle.mjs
      - name: Painted navigation frames, roles, chat and reentries
        run: node testing/council/navigation-frames.mjs /tmp/council-navigation-frames
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: council-mobile-review
          path: |
            .local/council-mobile/
            /tmp/council-visual-review/
            /tmp/council-visual-extras/
            /tmp/council-visual-state/
            /tmp/council-navigation-frames/
            /tmp/council-detail-review/
            /tmp/council-detail-validation/
