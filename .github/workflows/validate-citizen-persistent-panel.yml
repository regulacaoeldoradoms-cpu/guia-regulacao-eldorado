name: Citizen persistent panel

on:
  pull_request:
    paths:
      - 'js/**'
      - 'css/**'
      - 'cidadao/index.html'
      - 'index.html'
      - 'login/index.html'
      - 'amigos/index.html'
      - 'perfil/index.html'
      - 'mascotes/index.html'
      - 'notificacoes/index.html'
      - 'ferramentas/index.html'
      - 'seguranca/index.html'
      - 'configuracoes/index.html'
      - 'conquistas/index.html'
      - 'portal-sw.js'
      - 'worker/pet-catalog.js'
      - 'worker/pet-domain.js'
      - 'testing/citizen-cache/**'
      - 'testing/citizen-layout/**'
      - 'testing/browser/**'
      - '.github/workflows/validate-citizen-persistent-panel.yml'

permissions:
  contents: read

jobs:
  retained-citizen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install synthetic browser harness
        working-directory: testing/browser
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Chromium path
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {chromium} from './testing/browser/node_modules/playwright/index.mjs';
          fs.appendFileSync(process.env.GITHUB_ENV, 'CHROMIUM_PATH=' + chromium.executablePath() + '\n');
          JS
      - name: Prepared routes, drafts, attachments, failures and session disposal
        run: node testing/citizen-layout/citizen-retained-panel.mjs
      - name: First direct visit upgrades cached PR663 markup and modules
        run: node testing/citizen-layout/citizen-retained-cache-update.mjs
      - name: Superseded reads cannot overwrite confirmed synthetic mutations
        run: node testing/citizen-layout/citizen-retained-read-races.mjs
      - name: Browser Back during submission preserves the confirmed result or failed draft
        run: node testing/citizen-layout/citizen-retained-submission.mjs
      - name: Security changes supersede reads interrupted by retained navigation
        run: node testing/citizen-layout/citizen-retained-security-race.mjs
      - name: Direct Citizen startup resumes once after leaving during its first load
        run: node testing/citizen-layout/citizen-retained-startup.mjs
      - name: Read deadlines without AbortSignal static helpers
        run: node testing/citizen-layout/citizen-retained-abort-compat.mjs
      - name: Legacy AbortSignal support preserves mutations and session disposal
        env:
          MISSING_ABORT_METHODS: 'any,timeout'
          RETAINED_OUTPUT: '.local/citizen-retained-panel-abort-fallback'
          READ_RACE_OUTPUT: '.local/citizen-retained-read-races-abort-fallback'
        run: |
          node testing/citizen-layout/citizen-retained-read-races.mjs
          RETAINED_CASES=logout-during-first-data-load,session-logout,session-replace node testing/citizen-layout/citizen-retained-panel.mjs
      - name: Preserve native geometry, desktop and print against PR663
        env:
          PRESERVE_WIDTHS: '360,390,1440'
        run: node testing/citizen-layout/citizen-retained-preservation.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: citizen-persistent-panel-synthetic-evidence
          include-hidden-files: true
          path: |
            .local/citizen-retained-panel/
            .local/citizen-retained-cache-update/
            .local/citizen-retained-read-races/
            .local/citizen-retained-submission/
            .local/citizen-retained-security-race/
            .local/citizen-retained-startup/
            .local/citizen-retained-abort-compat/
            .local/citizen-retained-panel-abort-fallback/
            .local/citizen-retained-read-races-abort-fallback/
            .local/citizen-retained-preservation/
