name: Validar Telemedicina Modal e Exclusão V21

on:
  pull_request:
    paths:
      - 'telemedicina/index.html'
      - 'css/telemedicina-modal-delete-v21.css'
      - 'js/telemedicina-modal-delete-v21.js'
      - 'worker/telemedicine.js'
      - 'docs/TELEMEDICINA-MODAL-EXCLUSAO-V21.md'
      - '.github/workflows/validate-telemedicine-modal-delete-v21.yml'
  push:
    branches: [main]
    paths:
      - 'telemedicina/index.html'
      - 'css/telemedicina-modal-delete-v21.css'
      - 'js/telemedicina-modal-delete-v21.js'
      - 'worker/telemedicine.js'
      - 'docs/TELEMEDICINA-MODAL-EXCLUSAO-V21.md'
      - '.github/workflows/validate-telemedicine-modal-delete-v21.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar sintaxe JavaScript
        run: |
          node --check js/telemedicina-modal-delete-v21.js
          node --check worker/telemedicine.js
      - name: Validar carregamento e ordem da camada modal
        run: |
          grep -q 'telemedicina-modal-delete-v21.css?v=20260908-2' telemedicina/index.html
          grep -q 'telemedicina-modal-delete-v21.js?v=20260908-2' telemedicina/index.html
          python - <<'PY'
          from pathlib import Path
          html = Path('telemedicina/index.html').read_text()
          guard = html.index('/js/telemedicina-modal-delete-v21.js?v=20260908-2')
          interactions = html.index('/js/portal-interactions.js?v=20260910-2')
          base = html.index('/js/telemedicina.js?v=20260906-1')
          mobile = html.index('/js/telemedicina-mobile-v9.js?v=20260905-2')
          assert guard < interactions, 'A guarda modal deve carregar antes de portal-interactions.'
          assert guard < base and guard < mobile, 'A guarda de estabilidade deve carregar antes dos handlers legados de filtro.'
          assert html.count('data-portal-interaction-ignore="true"') >= 5, 'Os modais estáticos da Telemedicina devem ignorar a camada global de microinterações.'
          PY
      - name: Validar estabilidade visual da Telemedicina
        run: |
          grep -q 'body.telemedicine-page .portal-interaction-pressing:not(:disabled)' css/telemedicina-modal-delete-v21.css
          grep -q 'body.telemedicine-page .portal-content-updating' css/telemedicina-modal-delete-v21.css
          python - <<'PY'
          from pathlib import Path
          css = Path('css/telemedicina-modal-delete-v21.css').read_text()
          press = css.split('body.telemedicine-page .portal-interaction-pressing:not(:disabled)', 1)[1].split('}', 1)[0]
          update = css.split('body.telemedicine-page .portal-content-updating', 1)[1].split('}', 1)[0]
          assert 'transform: none !important' in press, 'A pressão não pode mover ou redimensionar controles da Telemedicina.'
          assert 'animation: none !important' in update, 'A atualização de conteúdo não pode fazer a página pular.'
          assert 'transform: none !important' in update, 'A atualização de conteúdo não pode deslocar a página.'
          PY
      - name: Validar filtros sem rolagem automática
        run: |
          grep -q 'handleStatusFilterWithoutScroll' js/telemedicina-modal-delete-v21.js
          grep -q "closest('.telemedicine-stat\[data-status-filter\]')" js/telemedicina-modal-delete-v21.js
          grep -q 'const scrollX = window.scrollX' js/telemedicina-modal-delete-v21.js
          grep -q 'const scrollY = window.scrollY' js/telemedicina-modal-delete-v21.js
          grep -q "filter.dispatchEvent(new Event('change', { bubbles: true }))" js/telemedicina-modal-delete-v21.js
          grep -q 'window.scrollTo(scrollX, scrollY)' js/telemedicina-modal-delete-v21.js
          grep -q 'event.stopImmediatePropagation()' js/telemedicina-modal-delete-v21.js
      - name: Validar isolamento modal estável
        run: |
          grep -q "setAttribute('inert'" js/telemedicina-modal-delete-v21.js
          grep -q 'stopImmediatePropagation' js/telemedicina-modal-delete-v21.js
          grep -q 'focusin' js/telemedicina-modal-delete-v21.js
          grep -q "event.key !== 'Tab'" js/telemedicina-modal-delete-v21.js
          grep -q 'data-portal-interaction-ignore' js/telemedicina-modal-delete-v21.js
          grep -q 'modalStateMutation' js/telemedicina-modal-delete-v21.js
          grep -q "target.classList.contains('modal-backdrop')" js/telemedicina-modal-delete-v21.js
          grep -q 'backdrop-filter: none !important' css/telemedicina-modal-delete-v21.css
          grep -q 'transition: none !important' css/telemedicina-modal-delete-v21.css
          grep -q 'animation: none !important' css/telemedicina-modal-delete-v21.css
          grep -q 'pointer-events: none !important' css/telemedicina-modal-delete-v21.css
      - name: Validar texto operacional da confirmação
        run: |
          grep -q 'As informações já registradas no histórico serão preservadas' js/telemedicina-modal-delete-v21.js
          ! grep -q 'inativo no backend' js/telemedicina-modal-delete-v21.js
          ! grep -q 'rastreabilidade técnica' js/telemedicina-modal-delete-v21.js
      - name: Validar exclusão protegida
        run: |
          grep -q "GET, POST, PATCH, DELETE, OPTIONS" worker/telemedicine.js
          grep -q "request.method === 'DELETE'" worker/telemedicine.js
          grep -q 'async function deleteFollowup' worker/telemedicine.js
          grep -q 'active: false' worker/telemedicine.js
          grep -q 'deletedAt:' worker/telemedicine.js
          grep -q 'deletedBy:' worker/telemedicine.js
          grep -q 'item.patientId === patientId && !item.deletedAt' worker/telemedicine.js
          grep -q 'data-telemedicine-delete' js/telemedicina-modal-delete-v21.js
          grep -q 'tm-delete-confirm-button' js/telemedicina-modal-delete-v21.js
          grep -q 'telemedicine-delete-button' css/telemedicina-modal-delete-v21.css
      - name: Garantir ausência de dependência por emoji ou pacote externo
        run: |
          ! grep -Eq 'https?://|cdnjs|unpkg|jsdelivr' js/telemedicina-modal-delete-v21.js css/telemedicina-modal-delete-v21.css
