<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <link rel="icon" href="data:,">
  <title>Laboratório visualizador/editor — Central de Documentos</title>
  <link rel="stylesheet" href="/css/documents.css">
  <style>
    html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#eef3f7;color:#173b5c}
    .lab-shell{max-width:1280px;margin:0 auto;padding:18px}
    .lab-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
    .lab-head h1{font-size:1.1rem;margin:0 auto 0 0}
    .lab-badge{padding:6px 9px;border-radius:999px;background:#fff3cd;color:#6b5200;font-weight:700;font-size:.78rem}
    .lab-status{padding:8px 10px;border-radius:8px;background:#fff;border:1px solid #cfd9e3;font-size:.84rem}
    .lab-status[data-state="ready"]{border-color:#98c9a8;color:#1e6635}
    .lab-status[data-state="error"]{border-color:#e4a0a0;color:#9b2222}
    .portal-button{border:1px solid #c7d4e0;background:#fff;color:#173b5c;border-radius:8px;padding:8px 11px;font-weight:700;cursor:pointer}
    .portal-button.primary{background:#195b8f;border-color:#195b8f;color:#fff}
    .portal-button:disabled{opacity:.48;cursor:not-allowed}
    .lab-editor-status{min-height:1.1em}
  </style>
</head>
<body>
  <main class="lab-shell">
    <div class="lab-head">
      <h1>Laboratório automatizado do visualizador/editor PDF.js</h1>
      <span class="lab-badge">DADOS FICTÍCIOS</span>
      <span id="labStatus" class="lab-status" data-state="loading">Inicializando…</span>
      <button id="enterEditor" class="portal-button primary" type="button" disabled>Editar PDF</button>
    </div>

    <section id="pdfRoot" class="documents-custom-viewer" aria-label="Visualizador PDF de teste">
      <div class="documents-pdf-toolbar">
        <button id="zoomOut" class="portal-button documents-art-button documents-art-zoom-minus" type="button" aria-label="Diminuir zoom"></button>
        <button id="zoomReset" class="portal-button" type="button">100%</button>
        <button id="zoomIn" class="portal-button documents-art-button documents-art-zoom-plus" type="button" aria-label="Aumentar zoom"></button>
        <button id="fitWidth" class="portal-button documents-art-button documents-art-fit-width" type="button" aria-label="Ajustar largura"></button>
        <span id="pageCount" class="documents-pdf-page-count">—</span>
      </div>
      <div id="editorControls" class="documents-editor" hidden aria-label="Controles de edição local do PDF">
        <div class="documents-editor-toolbar documents-editor-toolbar--compact" role="toolbar" aria-label="Ações de edição do PDF sintético">
          <button id="editorUndo" class="documents-editor-tool" type="button" title="Desfazer (Ctrl+Z)">↶</button>
          <button id="editorRedo" class="documents-editor-tool" type="button" title="Refazer (Ctrl+Y ou Ctrl+Shift+Z)">↷</button>
          <span class="documents-editor-tool-separator"></span>
          <button id="editorOrganize" class="documents-editor-tool active documents-art-button documents-art-grid" type="button" title="Organizar" aria-label="Organizar" aria-pressed="true"></button>
          <button id="editorMerge" class="documents-editor-tool documents-tool-icon documents-tool-icon-merge" type="button" title="Unir PDF sintético" aria-label="Unir PDF sintético"></button>
          <button id="editorBlank" class="documents-editor-tool documents-tool-icon documents-tool-icon-blank" type="button" title="Inserir página em branco" aria-label="Inserir página em branco"></button>
          <button id="editorAddImage" class="documents-editor-tool documents-tool-icon documents-tool-icon-add-image" type="button" title="Adicionar imagem como página" aria-label="Adicionar imagem como página"></button>
          <input id="editorAddImageInput" type="file" accept="image/*" multiple hidden>
          <button id="editorCrop" class="documents-editor-tool documents-tool-icon documents-tool-icon-crop" type="button" title="Recortar página" aria-label="Recortar página" aria-pressed="false"></button>
          <button id="editorSelect" class="documents-editor-tool documents-tool-icon documents-tool-icon-select" type="button" title="Selecionar e mover objetos" aria-label="Selecionar e mover objetos"></button>
          <button id="editorWrite" class="documents-editor-tool documents-tool-icon documents-tool-icon-write" type="button" title="Escrever sobre a página" aria-label="Escrever sobre a página"></button>
          <button id="editorOverlayImage" class="documents-editor-tool documents-tool-icon documents-tool-icon-paste-image" type="button" title="Colar imagem sobre a página" aria-label="Colar imagem sobre a página"></button>
          <input id="editorOverlayImageInput" type="file" accept="image/*" hidden>
          <button id="editorDraw" class="documents-editor-tool documents-tool-icon documents-tool-icon-draw" type="button" title="Desenhar sobre a página" aria-label="Desenhar sobre a página" aria-pressed="false"></button>
          <span class="documents-editor-tool-spacer"></span>
          <button id="editorSync" class="documents-editor-tool documents-art-button documents-art-sync" type="button" title="Forçar sincronização com Google Drive" aria-label="Forçar sincronização com Google Drive"></button>
          <button id="editorExport" class="documents-editor-tool documents-art-button documents-art-export" type="button" title="Exportar PDF final localmente" aria-label="Exportar PDF final localmente"></button>
          <button id="editorPrint" class="documents-editor-tool documents-art-button documents-art-print" type="button" title="Imprimir PDF final (Ctrl+P)" aria-label="Imprimir PDF final"></button>
          <button id="editorExit" class="documents-editor-tool documents-art-button documents-art-close" type="button" title="Sair do editor" aria-label="Sair do editor"></button>
        </div>
        <div id="editorStatus" class="documents-editor-status lab-editor-status" aria-live="polite"></div>
        <div id="editorDrawToolbar" class="documents-draw-toolbar" hidden aria-label="Ferramentas de desenho sintético">
          <label class="documents-draw-field"><span>Cor</span><input id="editorDrawColor" type="color" value="#111111"></label>
          <label class="documents-draw-field"><span>Espessura</span><input id="editorDrawWidth" type="range" min="1" max="20" step="1" value="4"></label>
          <button id="editorDrawPen" class="documents-draw-mode active" type="button" aria-pressed="true">Caneta</button>
          <button id="editorDrawEraser" class="documents-draw-mode" type="button" aria-pressed="false">Borracha</button>
        </div>
        <div id="editorObjectToolbar" class="documents-object-toolbar" hidden>
          <label class="documents-object-field documents-object-field--font"><span>Fonte</span>
            <select id="editorObjectFont"><option>Arial</option><option>Helvetica</option><option>Times New Roman</option><option>Courier New</option></select>
          </label>
          <label class="documents-object-field documents-object-field--font"><span>Tamanho</span>
            <input id="editorObjectFontSize" type="number" min="8" max="96" value="18">
          </label>
          <label class="documents-object-field documents-object-field--font"><span>Cor</span>
            <input id="editorObjectColor" type="color" value="#111111">
          </label>
          <div class="documents-object-format documents-object-field--font" id="editorObjectFormatField">
            <button id="editorObjectBold" class="documents-object-format-button" type="button" aria-pressed="false">B</button>
            <button id="editorObjectItalic" class="documents-object-format-button" type="button" aria-pressed="false">I</button>
            <button id="editorObjectUnderline" class="documents-object-format-button" type="button" aria-pressed="false">U</button>
            <select id="editorObjectAlign" aria-label="Alinhamento"><option value="left">Esquerda</option><option value="center">Centro</option><option value="right">Direita</option></select>
          </div>
          <label class="documents-object-field"><span>Transparência</span>
            <input id="editorObjectOpacity" type="range" min="10" max="100" step="5" value="100">
          </label>
          <button id="editorObjectDelete" class="documents-object-action" type="button" title="Excluir objeto">×</button>
        </div>
      </div>
      <aside id="editorMergePanel" class="documents-editor-panel" hidden aria-label="Unir documentos sintéticos">
        <div class="documents-editor-panel-head">
          <strong>Unir PDF sintético</strong>
          <button id="editorMergeCancel" class="documents-editor-panel-close documents-art-button documents-art-close" type="button" title="Cancelar união" aria-label="Cancelar união"></button>
        </div>
        <p id="editorMergeSelectionLab">Segundo PDF sintético de 3 páginas selecionado para o laboratório. Você também pode adicionar PDF ou imagem do dispositivo; nada é enviado ao Google Drive.</p>
        <button id="editorMergeFileButton" class="portal-button documents-editor-local-import" type="button">Adicionar PDF ou imagem</button>
        <input id="editorMergeFileInput" type="file" accept=".pdf,application/pdf,image/*" multiple hidden>
        <div id="editorMergePreviewLab" class="documents-editor-merge-preview" hidden aria-live="polite"></div>
        <label class="documents-editor-field">Inserir
          <select id="editorMergePosition">
            <option value="before-document">Antes do documento atual</option>
            <option value="after-document" selected>Após o documento atual</option>
            <option value="after-page">Após uma página específica</option>
          </select>
        </label>
        <label id="editorMergePageField" class="documents-editor-field" hidden>Após a página
          <input id="editorMergeAfterPage" type="number" min="1" max="3" step="1" value="1" required>
        </label>
        <button id="editorMergeConfirm" class="portal-button primary" type="button">Unir</button>
      </aside>
      <div class="documents-pdf-layout">
        <aside id="thumbnails" class="documents-pdf-thumbnails" aria-label="Miniaturas"></aside>
        <div id="scrollRoot" class="documents-pdf-scroll" tabindex="0">
          <div id="pages" class="documents-pdf-pages"></div>
        </div>
      </div>
    </section>
  </main>

  <script src="/testing/central-docs/fixture.js"></script>
  <script src="/js/document-editor.js"></script>
  <script src="/js/document-viewer.js"></script>
  <script src="/testing/central-docs/editor-harness.js"></script>
</body>
</html>
