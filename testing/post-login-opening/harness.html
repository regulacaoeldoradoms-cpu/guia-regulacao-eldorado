<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'">
  <link rel="preload" href="/assets/portal-opening-v1.mp4?v=20260917-1" as="video" type="video/mp4">
  <title>Laboratório — Abertura pós-login</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3f7fb;color:#173b5d}
    body{min-height:100vh}
    .lab-shell{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#0d3157 0%,#174f7d 42%,#eef6fb 42%,#fff 100%)}
    .login-card{width:min(460px,100%);padding:30px;border-radius:24px;background:#fff;box-shadow:0 22px 60px rgba(13,49,87,.22)}
    .login-card h1{margin:0 0 8px;font-size:1.65rem}
    .login-card>p{margin:0 0 22px;color:#61798d;line-height:1.5}
    .portal-field{display:grid;gap:7px;margin-bottom:15px}
    .portal-field label{font-weight:800;font-size:.9rem}
    .portal-field input{width:100%;min-height:48px;padding:11px 13px;border:1px solid #bdd0df;border-radius:12px;font:inherit}
    .login-submit{width:100%;min-height:50px;border:0;border-radius:13px;background:#0d3157;color:#fff;font:800 1rem system-ui;cursor:pointer}
    .login-submit:disabled{cursor:wait;opacity:.62}
    .login-status{display:none;margin-top:14px;padding:12px;border-radius:11px;font-size:.88rem;line-height:1.4}
    .login-status.visible{display:block}
    .login-status.info{background:#eef8ff;border:1px solid #b9dcec;color:#174b73}
    .login-status.error{background:#fff0f1;border:1px solid #e8a7ad;color:#8f1824}
    .lab-note{margin-top:18px;padding-top:16px;border-top:1px solid #e0e9f0;color:#6a8092;font-size:.82rem;line-height:1.45}
    @media(max-width:680px){.lab-shell{padding:14px;background:#eef6fb}.login-card{padding:24px 20px;border-radius:19px}}
  </style>
</head>
<body class="portal-page login-page">
  <main class="lab-shell">
    <form class="login-card" id="loginForm" autocomplete="off">
      <h1>Laboratório da abertura</h1>
      <p>Login fictício. O botão só é liberado quando o MP4 oficial terminou de carregar localmente.</p>

      <div class="portal-field">
        <label for="loginUsername">Usuário fictício</label>
        <input id="loginUsername" value="usuario.teste" required>
      </div>
      <div class="portal-field">
        <label for="loginPassword">Senha fictícia</label>
        <input id="loginPassword" type="password" value="teste123" required>
      </div>
      <label style="display:flex;gap:8px;align-items:center;margin:0 0 16px;color:#637b8f;font-size:.86rem">
        <input id="loginRemember" type="checkbox"> Manter acesso neste computador
      </label>

      <button class="login-submit" id="loginSubmit" type="submit" disabled aria-disabled="true">Preparando abertura...</button>
      <div id="loginStatus" class="login-status" role="status" aria-live="polite"></div>

      <div class="lab-note">DADOS FICTÍCIOS · sem autenticação real, Drive, D1, pacientes ou segredos. O vídeo e o código da abertura são os mesmos da branch.</div>
    </form>
  </main>

  <script src="/opening/harness.js"></script>
  <script src="/js/login-opening.js?v=20260917-1"></script>
  <script src="/js/login.js?v=20260910-2"></script>
</body>
</html>
